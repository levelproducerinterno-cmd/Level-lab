<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis proyectos">
<meta name="theme-color" content="#f7f5f2">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Organiza tus proyectos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --negro:#0a0908;
    --hueso:#f7f5f2;
    --hueso2:#efece6;
    --linea:#e4dfd6;
    --texto:#2b2b2b;
    --gris:#8a8578;
    --rojo:#c72a09;
    --verde:#1a8f4c;
    --amarillo:#d9a916;
    --azul:#2f6fbf;
    --morado:#7a4fb5;
    --ventas:#d9a916;
    --produccion:#2f6fbf;
    --cobranza:#1a8f4c;
  }
  *{box-sizing:border-box;}
  html{overflow-x:hidden;}
  body{margin:0;font-family:'Montserrat',sans-serif;background:var(--hueso);color:var(--texto);-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 120px;}
  .oculto{display:none !important;}

  /* ---------- Encabezado ---------- */
  .hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
  .logo{display:inline-block;height:42px;width:auto;margin-bottom:10px;}
  .hero-marca{font-size:0.7rem;letter-spacing:0.22em;font-weight:700;color:var(--gris);text-transform:uppercase;}
  .hero h1{font-size:2rem;font-weight:800;margin:6px 0 4px;letter-spacing:-0.02em;}
  .hero p{margin:0;color:#5b574f;font-size:0.95rem;max-width:620px;line-height:1.5;}
  .btn{background:var(--negro);color:#fff;border:none;border-radius:10px;padding:12px 18px;font-weight:600;font-size:0.92rem;}
  .btn:hover{background:#2a2725;}
  .btn.ghost{background:transparent;color:var(--texto);border:1px solid var(--linea);}
  .btn.ghost:hover{background:var(--hueso2);}
  .btn.peligro{background:transparent;color:var(--rojo);border:1px solid #f0cfc6;}

  /* ---------- Resumen / recorrido ---------- */
  .recorrido{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 10px;position:sticky;top:0;z-index:20;background:var(--hueso);padding:10px 0;}
  .paso{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:14px 16px;text-align:left;border-top:4px solid var(--c);transition:transform .15s;}
  .paso:hover{transform:translateY(-2px);}
  .paso-num{font-size:0.72rem;font-weight:700;color:var(--c);letter-spacing:0.08em;text-transform:uppercase;}
  .paso-valor{font-size:1.35rem;font-weight:800;margin-top:4px;color:var(--texto);}
  .paso-desc{font-size:0.78rem;color:var(--gris);margin-top:2px;}
  .consejo{font-size:0.85rem;color:#5b574f;margin:0 0 6px;}

  .aviso-ejemplos{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#fff8e0;border:1px solid #f0e2a8;border-radius:12px;padding:12px 16px;font-size:0.88rem;margin:14px 0;}

  /* ---------- Secciones y columnas ---------- */
  .seccion{margin-top:34px;scroll-margin-top:110px;}
  .seccion-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px;}
  .seccion-head h2{margin:0;font-size:1.45rem;font-weight:800;letter-spacing:-0.01em;}
  .seccion-head .chip-num{background:var(--c);color:#fff;border-radius:8px;padding:2px 9px;font-size:0.85rem;font-weight:700;}
  .seccion-intro{color:#5b574f;font-size:0.9rem;margin:2px 0 14px;line-height:1.5;max-width:760px;}
  .columnas{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;}
  .columnas.una{grid-auto-columns:minmax(250px,420px);}
  .col{background:var(--hueso2);border-radius:14px;padding:10px;min-height:120px;scroll-snap-align:start;transition:background .15s, box-shadow .15s;}
  .col.drop{background:#e6e1d6;box-shadow:inset 0 0 0 2px var(--c);}
  .col-head{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 10px;gap:8px;}
  .col-titulo{font-size:0.82rem;font-weight:700;padding:3px 9px;border-radius:6px;background:var(--tag);color:var(--tagt);}
  .col-total{font-size:0.75rem;color:var(--gris);font-weight:600;text-align:right;}
  .col-vacia{font-size:0.8rem;color:#aaa49a;text-align:center;padding:18px 6px;border:1.5px dashed #d8d2c6;border-radius:10px;}
  .col-agregar{width:100%;background:transparent;border:1.5px dashed #d0c9bb;border-radius:10px;padding:10px;color:var(--gris);font-weight:600;font-size:0.85rem;margin-top:4px;}
  .col-agregar:hover{background:#fff;color:var(--texto);}

  /* ---------- Tarjetas ---------- */
  .card{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:12px 13px;margin-bottom:9px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:box-shadow .15s, transform .15s;}
  .card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08);}
  .card.arrastrando{opacity:.45;}
  .card.destello{animation:destello 1.6s ease;}
  @keyframes destello{0%{box-shadow:0 0 0 0 rgba(217,169,22,.9);transform:scale(1.03);}100%{box-shadow:0 0 0 14px rgba(217,169,22,0);transform:scale(1);}}
  .card-nombre{font-weight:700;font-size:0.95rem;line-height:1.3;}
  .card-cliente{font-size:0.82rem;color:#5b574f;margin-top:2px;}
  .card-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:0.78rem;}
  .tag{background:#e8eef8;color:#2f5a95;border-radius:5px;padding:2px 7px;font-weight:600;}
  .tag.ejemplo{background:#f3efe6;color:#8a8578;}
  .monto{font-weight:700;}
  .fecha{color:var(--gris);}
  .fecha.tarde{color:var(--rojo);font-weight:600;}
  .barra{height:7px;background:#eee9df;border-radius:5px;overflow:hidden;margin-top:9px;}
  .barra > div{height:100%;background:var(--c, var(--produccion));border-radius:5px;transition:width .4s;}
  .barra-label{display:flex;justify-content:space-between;font-size:0.72rem;color:var(--gris);margin-top:4px;}
  .debe{margin-top:8px;font-size:0.82rem;}
  .debe strong{font-size:1.05rem;color:var(--cobranza);}
  .card-acciones{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .accion{flex:1;background:var(--negro);color:#fff;border:none;border-radius:8px;padding:8px 10px;font-size:0.8rem;font-weight:600;white-space:nowrap;}
  .accion:hover{background:#2a2725;}
  .accion.sec{flex:0 0 auto;background:transparent;color:var(--gris);border:1px solid var(--linea);}
  .accion.sec:hover{color:var(--rojo);border-color:#f0cfc6;}

  /* Avance de edición (slider con nombre en cada porcentaje) */
  .edicion-box{margin-top:10px;background:#f6f2fb;border-radius:10px;padding:9px 10px;}
  .edicion-paso{font-size:0.78rem;font-weight:700;color:var(--morado);display:flex;justify-content:space-between;}
  input[type=range]{width:100%;accent-color:var(--morado);margin:8px 0 2px;}
  .marcas{position:relative;height:14px;}
  .marcas span{position:absolute;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:#cbb9e3;top:2px;cursor:pointer;}
  .marcas span.ok{background:var(--morado);}

  .cobrados{margin-top:14px;background:#fff;border:1px solid var(--linea);border-radius:12px;}
  .cobrados summary{padding:12px 16px;cursor:pointer;font-weight:600;font-size:0.9rem;}
  .cobrado-fila{display:flex;justify-content:space-between;gap:10px;padding:10px 16px;border-top:1px solid var(--hueso2);font-size:0.85rem;cursor:pointer;}
  .cobrado-fila:hover{background:var(--hueso);}

  .como{margin-top:40px;background:#fff;border:1px solid var(--linea);border-radius:14px;padding:6px 18px;}
  .como summary{cursor:pointer;font-weight:700;padding:10px 0;}
  .como ol{padding-left:20px;line-height:1.7;font-size:0.9rem;margin:4px 0 14px;}

  /* ---------- Modal ---------- */
  .modal-bg{position:fixed;inset:0;background:rgba(10,9,8,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:22px;}
  .modal h3{margin:0 0 14px;font-size:1.2rem;}
  .campo{margin-bottom:14px;}
  .campo label{display:block;font-size:0.78rem;font-weight:700;color:#5b574f;margin-bottom:5px;}
  .campo input, .campo select{width:100%;border:1px solid var(--linea);border-radius:9px;padding:11px 12px;font-size:16px;background:#fff;color:var(--texto);}
  .campo input:focus, .campo select:focus{outline:2px solid #d9cfbd;}
  .fila2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{border:1px solid var(--linea);background:#fff;border-radius:20px;padding:6px 12px;font-size:0.82rem;font-weight:600;color:#5b574f;}
  .chip.on{background:var(--negro);color:#fff;border-color:var(--negro);}
  .ayuda{font-size:0.75rem;color:var(--gris);margin-top:5px;}
  .modal-pie{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap;}
  .modal-pie .der{display:flex;gap:8px;margin-left:auto;}

  .aviso{max-width:560px;margin:6vh auto 0;background:#fff;border:1px solid var(--linea);border-radius:18px;padding:28px 26px;}
  .aviso h1{font-size:1.6rem;font-weight:800;margin:8px 0 14px;}
  .aviso p, .aviso li, .aviso-modal p, .aviso-modal li{font-size:0.92rem;line-height:1.6;color:#3d3a35;}
  .aviso ul, .aviso-modal ul{padding-left:20px;margin:8px 0 16px;}
  .aviso li, .aviso-modal li{margin-bottom:8px;}
  .aviso h4, .aviso-modal h4{font-size:0.95rem;font-weight:700;margin:18px 0 4px;color:var(--texto);}
  .aviso p, .aviso-modal p{margin:0 0 6px;}
  .aviso-acepta{margin:20px 0 16px !important;background:var(--hueso);border-radius:10px;padding:12px 14px;}
  .pin-input{width:100%;max-width:220px;text-align:center;font-size:1.8rem;letter-spacing:0.5em;padding:12px 0 12px 0.5em;border:1px solid var(--linea);border-radius:12px;font-family:inherit;}
  .pin-input:focus{outline:2px solid #d9cfbd;}
  .cotizar{width:100%;margin-top:10px;background:#fff8e0;border:1px solid #f0e2a8;color:#6b5200;border-radius:8px;padding:8px 10px;font-size:0.8rem;font-weight:700;}
  .cotizar:hover{background:#fcefc4;}
  .moneda-sel{border:1px solid var(--linea);border-radius:6px;padding:2px 4px;font-size:0.75rem;background:#fff;color:var(--gris);}
  .modal.cot{max-width:640px;padding:0 22px 22px;}
  .cot-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:sticky;top:0;background:#fff;padding:20px 0 12px;z-index:2;border-bottom:1px solid var(--hueso2);}
  .cot-head h3{margin:4px 0 0;font-size:1.15rem;}
  .cot-x{background:var(--hueso2);border:none;border-radius:50%;width:34px;height:34px;flex:0 0 auto;}
  .cot-bloque{padding:16px 0;border-bottom:1px solid var(--hueso2);}
  .cot-titulo{font-weight:800;font-size:0.95rem;margin-bottom:10px;}
  .cot-tabs{display:flex;gap:6px;flex-wrap:wrap;padding-top:16px;}
  .cot-tab{border:1px solid var(--linea);background:#fff;border-radius:9px 9px 0 0;padding:8px 14px;font-weight:700;font-size:0.82rem;color:var(--gris);}
  .cot-tab.on{background:var(--negro);color:#fff;border-color:var(--negro);}
  .cot-tab.mas{border-style:dashed;}
  .cot-paquete-nombre{display:flex;gap:8px;align-items:center;background:var(--hueso);border-radius:0 10px 10px 10px;padding:10px;}
  .cot-paquete-nombre input{flex:1;border:1px solid var(--linea);border-radius:8px;padding:9px 10px;font-size:16px;font-weight:600;}
  .cot-cols{display:grid;grid-template-columns:1fr 70px 130px 28px;gap:6px;font-size:0.7rem;font-weight:700;color:var(--gris);margin-bottom:4px;}
  .cot-fila{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
  .cot-fila input{flex:1;min-width:0;border:1px solid var(--linea);border-radius:8px;padding:9px 10px;font-size:16px;}
  .cot-campo{display:block;margin:0;}
  .cot-campo input{width:100%;}
  .cot-campo.cot-n{flex:0 0 70px;}
  .cot-campo.cot-m{flex:0 0 130px;}
  .cot-mini{display:none;font-size:0.68rem;font-weight:700;color:var(--gris);margin-bottom:3px;}
  .cot-quitar{flex:0 0 28px;height:28px;border:none;background:transparent;color:#b5ae9f;border-radius:50%;}
  .cot-quitar:hover{background:#f7dcd5;color:var(--rojo);}
  .cot-tupago{margin-top:12px;background:#f6f2fb;border-radius:10px;padding:10px 12px;}
  .cot-tupago label{display:block;font-size:0.78rem;font-weight:700;color:var(--morado);margin-bottom:5px;}
  .cot-tupago input{width:100%;border:1px solid #ddd0ee;border-radius:8px;padding:9px 10px;font-size:16px;}
  .cot-resumen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
  .cot-resumen > div{background:var(--hueso);border-radius:10px;padding:10px;}
  .cot-resumen > div.sug{background:var(--negro);color:#fff;}
  .cot-resumen span{display:block;font-size:0.7rem;font-weight:700;opacity:.75;}
  .cot-resumen strong{display:block;font-size:1.1rem;margin-top:3px;}
  .cot-resumen em{display:block;font-size:0.68rem;font-style:normal;opacity:.7;margin-top:2px;}
  .cot-label{font-size:0.8rem;color:#5b574f;}
  .cot-rango{accent-color:var(--negro);}
  .cot-ganancia{font-size:0.85rem;border-radius:9px;padding:9px 12px;background:var(--hueso);color:#5b574f;margin-bottom:12px;}
  .cot-ganancia.bien{background:#e3f3e9;color:#146b3a;font-weight:600;}
  .cot-ganancia.ojo{background:#fff8e0;color:#7a5c00;}
  .cot-ganancia.mal{background:#f7dcd5;color:#9c2a10;font-weight:600;}
  .cot-check{display:flex;align-items:center;gap:8px;font-size:0.85rem;margin-bottom:12px;}
  .cot-pct{width:64px;border:1px solid var(--linea);border-radius:6px;padding:5px 6px;font-size:16px;}
  .cot-total{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;background:#e3f3e9;border-radius:10px;padding:12px 14px;}
  .cot-total span{font-size:0.8rem;font-weight:700;color:#146b3a;}
  .cot-total strong{font-size:1.4rem;color:#146b3a;}
  .cot-total em{font-size:0.78rem;font-style:normal;color:#146b3a;width:100%;}
  .hero-acciones{display:flex;gap:8px;align-items:center;}
  .cotizar-fila{display:flex;gap:6px;}
  .cotizar-fila .cotizar.pdf{flex:0 0 auto;width:auto;}
  .cot-tip{display:block;font-weight:500;margin-top:3px;}
  .cot-textarea{width:100%;border:1px solid var(--linea);border-radius:9px;padding:10px 12px;font-size:16px;font-family:inherit;resize:vertical;}
  .link{background:none;border:none;padding:4px 0;color:var(--gris);font-size:0.8rem;font-weight:600;text-decoration:underline;}
  .cot-marca{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--hueso);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:0.85rem;}
  .cot-marca img{height:28px;width:auto;max-width:90px;object-fit:contain;}
  .cot-marca span{flex:1;}
  .cot-marca.falta{background:#fff8e0;}
  .neg-logo{display:flex;gap:12px;align-items:center;}
  .neg-logo-prev{width:150px;height:80px;border:1.5px dashed #d0c9bb;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden;}
  .neg-logo-prev img{max-width:90%;max-height:90%;object-fit:contain;}
  .neg-logo-prev span{font-size:0.8rem;color:#aaa49a;}
  .color-chip{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--linea);}
  .color-chip.on{box-shadow:0 0 0 2px var(--negro);}
  #n-color{width:34px;height:34px;border:none;background:none;padding:0;}
  /* Sistema interno */
  .si-banner{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#f3ede3;border:1px solid #e2d8c6;border-radius:14px;padding:14px 18px;margin:4px 0 6px;}
  .si-banner p{flex:1;min-width:220px;margin:0;font-family:'Cormorant Garamond',serif;font-size:1.25rem;line-height:1.35;color:#2b2620;}
  .si-banner .btn{background:#2b2620;}
  .si-banner-anillos{width:44px;height:44px;flex:0 0 auto;border-radius:50%;background:repeating-radial-gradient(circle,#f3ede3 0 3px,#7f9a6b 3px 4px,#f3ede3 4px 7px,#c8613a 7px 8px,#f3ede3 8px 11px,#d4a537 11px 12px);border:1.5px solid #2b2620;}
  .si-bg{position:fixed;inset:0;z-index:120;background:#f3ede3;overflow:auto;padding:24px 16px 40px;}
  .si-panel{position:relative;max-width:620px;margin:0 auto;font-family:'Cormorant Garamond',serif;color:#2b2620;}
  .si-panel.ancho{max-width:860px;}
  .si-x{position:absolute;right:0;top:0;width:38px;height:38px;border-radius:50%;border:1px solid #d9cdb8;background:transparent;color:#2b2620;}
  .si-progreso{height:3px;background:#e2d8c6;border-radius:3px;margin:12px 52px 0 0;overflow:hidden;}
  .si-progreso > div{height:100%;background:#c8613a;transition:width .3s;}
  .si-cuerpo{padding-top:44px;}
  .si-eyebrow{font-family:Montserrat,sans-serif;font-size:0.72rem;font-weight:600;letter-spacing:0.22em;text-transform:uppercase;color:#8a7f70;display:flex;align-items:center;gap:8px;}
  .si-panel h2{font-size:2.5rem;font-weight:600;line-height:1.1;margin:10px 0 14px;}
  .si-panel p{font-size:1.25rem;line-height:1.5;color:#4a443c;margin:0 0 14px;}
  .si-def{border-left:2px solid #c8613a;padding-left:16px;}
  .si-input{width:100%;font-family:'Cormorant Garamond',serif;font-size:1.45rem;background:transparent;border:none;border-bottom:1.5px solid #2b2620;padding:10px 2px;color:#2b2620;outline:none;}
  .si-area{border:1.5px solid #cfc2ad;border-radius:12px;padding:14px;resize:vertical;line-height:1.45;background:rgba(255,255,255,.35);}
  .si-chips{margin:14px 0;}
  .si-chips .chip{background:transparent;border-color:#cfc2ad;color:#2b2620;font-family:Montserrat,sans-serif;}
  .si-chips .chip.on{background:#2b2620;color:#f3ede3;}
  .si-ideas-tit{font-family:Montserrat,sans-serif;font-size:0.72rem;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#8a7f70;margin-top:16px;}
  .si-otra{display:flex;gap:10px;align-items:flex-end;}
  .si-otra .btn{background:#2b2620;flex:0 0 auto;}
  .si-orden{list-style:none;padding:0;margin:20px 0 0;}
  .si-orden li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #e2d8c6;font-size:1.4rem;}
  .si-orden .si-nom{flex:1;}
  .si-orden button{width:34px;height:34px;border-radius:50%;border:1px solid #d9cdb8;background:transparent;color:#2b2620;}
  .si-orden button:disabled{opacity:.3;}
  .si-num{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;color:#fff;font-family:Montserrat,sans-serif;font-size:0.8rem;font-weight:700;flex:0 0 auto;}
  .si-pie{display:flex;justify-content:space-between;margin-top:28px;}
  .si-pie .btn{background:#2b2620;font-family:Montserrat,sans-serif;}
  .si-pie .btn.ghost{background:transparent;color:#2b2620;border-color:#cfc2ad;}
  .si-mapa{margin:10px auto 18px;max-width:640px;}
  .si-canvas{width:100%;height:auto;display:block;border-radius:14px;}
  .si-acciones{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:26px;}
  .si-acciones .btn{background:#2b2620;font-family:Montserrat,sans-serif;}

let MONEDA = 'MXN';
let fmt = new Intl.NumberFormat('es-MX', { style:'currency', currency:'MXN', maximumFractionDigits:0 });
function ponerMoneda(m){
  MONEDA = MONEDAS.some(x => x[0] === m) ? m : 'MXN';
  fmt = new Intl.NumberFormat('es-MX', { style:'currency', currency:MONEDA, currencyDisplay: MONEDA === 'MXN' ? 'narrowSymbol' : 'symbol', maximumFractionDigits:0 });

function leerPin(token){ try { return localStorage.getItem(pinKey(token)); } catch(e){ return null; } }
function recordarPin(token, pin){ try { pin ? localStorage.setItem(pinKey(token), pin) : localStorage.removeItem(pinKey(token)); } catch(e){} }

async function abrirTablero(token, pin){
  T = { token, pin: pin || leerPin(token), alumno:null, proyectos:[] };
  app.innerHTML = '<div class="cargando">Cargando tu tablero…</div>';
  const { data, error } = await sb.rpc('taller_tablero', { p_token: token, p_pin: T.pin });

    app.innerHTML = '<div class="cargando">No se pudo cargar. Revisa tu conexión y recarga la página.</div>';
    return;
  }
  if(!data){
    app.innerHTML = '<div class="cargando">Este link no es válido. Pídele a quien te lo mandó que te lo comparta de nuevo.</div>';
    return;

  T.alumno = data.alumno || {};

    case 'crear_pin': mostrarCrearPin(); return;

// Pantalla para escribir los 4 números (se usa al crear y al entrar)
function pantallaPin({ titulo, texto, boton, msg, bloqueado, confirmar, alEnviar }){

      ${confirmar ? '' : '<p class="ayuda" style="margin-top:16px;">¿Olvidaste tu PIN? Pídele a Sofía que te lo reinicie y crea uno nuevo.</p>'}
    </div>`;
  const p1 = document.getElementById('pin-1');
  const p2 = document.getElementById('pin-2');
  const msgEl = document.getElementById('pin-msg');
  const soloNumeros = i => i && i.addEventListener('input', () => { i.value = i.value.replace(/\D/g, '').slice(0, 4); });
  soloNumeros(p1); soloNumeros(p2);
  const enviar = () => {
    if(!/^\d{4}$/.test(p1.value)){ msgEl.textContent = 'El PIN debe tener 4 números.'; p1.focus(); return; }
    if(p2 && p1.value !== p2.value){ msgEl.textContent = 'Los dos PIN no coinciden.'; p2.value = ''; p2.focus(); return; }
    document.getElementById('pin-ok').disabled = true;
    alEnviar(p1.value, m => { msgEl.textContent = m; document.getElementById('pin-ok').disabled = false; });
  };
  document.getElementById('pin-ok').addEventListener('click', enviar);
  [p1, p2].forEach(i => i && i.addEventListener('keydown', e => { if(e.key === 'Enter') enviar(); }));
  if(!bloqueado) p1.focus();
}

function pinRechazado(data){

function renderSeccion(s){

  const perdidos = P.filter(p => p.etapa === 'perdido');
  const pagados = P.filter(p => p.etapa === 'pagado');

    else if(etapa === 'entregado' && lista.length) total = `Te deben:<br><strong>${dinero(lista.reduce((a,p) => a + saldo(p), 0))}</strong>`;
    else if(lista.length) total = lista.length + (lista.length === 1 ? ' proyecto' : ' proyectos');

        </div>` : ''}

        <div class="cotizar-fila" data-stop>

function conectarTarjetas(){
  app.querySelectorAll('[data-nuevo]').forEach(b => b.addEventListener('click', () => abrirEditor(null)));
  app.querySelectorAll('[data-abrir]').forEach(f => f.addEventListener('click', () => abrirEditor(buscar(f.dataset.abrir))));
  app.querySelectorAll('.card').forEach(card => {
    const p = buscar(card.dataset.id);
    card.addEventListener('click', e => { if(!e.target.closest('[data-stop]')) abrirEditor(p); });
    card.querySelectorAll('[data-mover]').forEach(b => b.addEventListener('click', () => moverA(p, b.dataset.mover)));
    const bCot = card.querySelector('[data-cotizar]');
    if(bCot) bCot.addEventListener('click', () => abrirCotizador(p));
    const bPdf = card.querySelector('[data-pdf-card]');
    if(bPdf) bPdf.addEventListener('click', async () => {
      bPdf.disabled = true;
      await descargarPDF(p, p.cotizacion);
      bPdf.disabled = false;
    });

    // Arrastrar entre columnas (computadora)
    card.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', p.id); card.classList.add('arrastrando'); });
    card.addEventListener('dragend', () => card.classList.remove('arrastrando'));

    // Barra de avance de edición: cada porcentaje lleva el nombre de su paso
    const slider = card.querySelector('[data-slider]');
    if(slider){
      const pinta = v => {
        card.querySelector('[data-paso-txt]').textContent = pasoEdicion(v);
        card.querySelector('[data-paso-num]').textContent = v + '%';
        card.querySelectorAll('[data-marca]').forEach(m => m.classList.toggle('ok', v >= +m.dataset.marca));
        const prog = 40 + Math.round(v * 0.6);
        card.querySelector('.barra > div').style.width = prog + '%';
        card.querySelector('.barra-label strong').textContent = prog + '%';
      };
      slider.addEventListener('input', () => pinta(+slider.value));
      slider.addEventListener('change', () => guardar({ id:p.id, avance_edicion:+slider.value }, { sinRender:true }));
      card.querySelectorAll('[data-marca]').forEach(m => m.addEventListener('click', () => {
        slider.value = m.dataset.marca; pinta(+slider.value);
        guardar({ id:p.id, avance_edicion:+slider.value }, { sinRender:true });
      }));
    }
  });
  app.querySelectorAll('.col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drop'); });
    col.addEventListener('dragleave', () => col.classList.remove('drop'));
    col.addEventListener('drop', e => {
      e.preventDefault(); col.classList.remove('drop');
      const p = buscar(e.dataTransfer.getData('text/plain'));
      if(p && p.etapa !== col.dataset.etapa) moverA(p, col.dataset.etapa);
    });
  });
}

const buscar = id => T.proyectos.find(p => p.id === id);

// Cambia la etapa. Al recibir anticipo pregunta cuánto, para que Cobranza sepa cuánto falta.
function moverA(p, etapa){
  if(etapa === 'anticipo' && ETAPAS[p.etapa].seccion === 'ventas'){
    preguntarAnticipo(p);
    return;
  }
  const cambios = { id:p.id, etapa };
  if(etapa === 'edicion' && p.avance_edicion >= 100) cambios.avance_edicion = 0;
  if(etapa === 'entregado' || etapa === 'pagado') cambios.avance_edicion = 100;
  guardar(cambios, { destacar:true, msg: mensajeEtapa(etapa) });
}

function mensajeEtapa(etapa){
  return {
    cotizacion:'Cotización enviada. ¡Dale seguimiento!',
    perdido:'Marcado como perdido. Ese número también enseña.',
    anticipo:'¡Anticipo recibido! Bajó a Producción 🎬',
    preproduccion:'En preproducción', produccion:'¡A grabar! 🎥', edicion:'A editar ✂️',
    entregado:'¡Entregado! Bajó a Cobranza 💰',
    pagado:'¡Cobrado! 🎉'
  }[etapa];
}

function preguntarAnticipo(p){
  const total = +p.monto_total || 0;
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal" style="max-width:420px;">
      <h3>💵 ¿Cuánto te pagaron de anticipo?</h3>
      <p class="ayuda" style="margin:-6px 0 14px;font-size:0.85rem;">${esc(p.nombre)} · Total ${dinero(total)}. Así Cobranza sabe cuánto te falta cobrar.</p>
      <div class="chips" style="margin-bottom:12px;">
        <button class="chip" data-pct="50">50% · ${dinero(total * 0.5)}</button>
        <button class="chip" data-pct="100">Todo · ${dinero(total)}</button>
        <button class="chip" data-pct="0">Nada, paga al entregar</button>
      </div>
      <div class="campo"><label>Otro monto</label><input type="number" inputmode="decimal" id="ant-monto" placeholder="0" value="${+p.anticipo || ''}"></div>
      <div class="modal-pie"><div class="der"><button class="btn ghost" data-cerrar>Cancelar</button><button class="btn" id="ant-ok">Guardar</button></div></div>
    </div>`;
  document.body.appendChild(bg);
  const cerrar = () => bg.remove();
  const ok = monto => { cerrar(); guardar({ id:p.id, etapa:'anticipo', anticipo:monto }, { destacar:true, msg:mensajeEtapa('anticipo') }); };
  bg.addEventListener('click', e => { if(e.target === bg || e.target.closest('[data-cerrar]')) cerrar(); });
  bg.querySelectorAll('[data-pct]').forEach(c => c.addEventListener('click', () => ok(Math.round(total * (+c.dataset.pct) / 100))));
  bg.querySelector('#ant-ok').addEventListener('click', () => ok(+bg.querySelector('#ant-monto').value || 0));
}

async function guardar(cambios, opts = {}){
  // Actualizamos en pantalla de inmediato y guardamos detrás
  const previo = cambios.id ? { ...buscar(cambios.id) } : null;
  if(previo) Object.assign(buscar(cambios.id), cambios);
  if(previo && !opts.sinRender) renderTablero(opts.destacar ? cambios.id : null);
  const { data, error } = await sb.rpc('taller_guardar_proyecto', { p_token: T.token, p_pin: T.pin, p: cambios });
  if(pinRechazado(data)) return null;
  if(error){
    console.error(error);
    if(previo) Object.assign(buscar(cambios.id), previo);
    renderTablero();
    toast('No se pudo guardar. Revisa tu conexión.');
    return null;
  }
  if(!previo){
    T.proyectos.push(data);
    renderTablero(data.id);
  } else {
    Object.assign(buscar(data.id), data);
  }
  if(opts.msg) toast(opts.msg);
  return data;
}

// ============ COTIZADOR (paso Prospecto) ======================
// ============================================================
// Calcula cuánto cuesta hacer el proyecto (equipo, tu pago, edición, gastos) y cuánto cobrar.
// Hasta 3 paquetes; el paquete elegido define el monto del proyecto en el tablero.
const MAX_PAQUETES = 3;
const PLANTILLAS = {
  'Boda':          { equipo:['Camarógrafo','Fotógrafo'], edicion:['Video principal','Reel','Fotos editadas'], gastos:['Transporte','Comidas'] },
  'Fotografía':    { equipo:['Fotógrafo'], edicion:['Fotos editadas'], gastos:['Transporte'] },
  'Video musical': { equipo:['Camarógrafo','Asistente','Iluminación'], edicion:['Edición y color'], gastos:['Locación','Renta de equipo','Transporte'] },
  'Evento':        { equipo:['Camarógrafo','Fotógrafo'], edicion:['Video resumen','Fotos editadas'], gastos:['Transporte'] },
  'Redes':         { equipo:['Camarógrafo'], edicion:['Reels'], gastos:['Transporte'] },
  'Comercial':     { equipo:['Camarógrafo','Asistente','Sonido'], edicion:['Edición','Color y audio'], gastos:['Locación','Renta de equipo','Transporte'] },
  'Institucional': { equipo:['Camarógrafo','Asistente'], edicion:['Video principal'], gastos:['Transporte'] },
  'Otro':          { equipo:[], edicion:[], gastos:[] }
};

function paqueteDesdePlantilla(tipo, nombre){
  const pl = PLANTILLAS[tipo] || PLANTILLAS['Otro'];
  return {
    nombre, solo:false, tu_pago:'', margen:30, precio:'',
    equipo: pl.equipo.map(puesto => ({ puesto, cant:1, pago:'' })),
    edicion: pl.edicion.map(concepto => ({ concepto, costo:'' })),
    gastos: pl.gastos.map(concepto => ({ concepto, costo:'' }))
  };
}
const num = v => Number(v) || 0;
const redondear = (v, a = 100) => Math.ceil(v / a) * a;

function calcularPaquete(pq, imp){
  const equipo = pq.solo ? 0 : pq.equipo.reduce((a, r) => a + num(r.cant) * num(r.pago), 0);
  const edicion = pq.edicion.reduce((a, r) => a + num(r.costo), 0);
  const gastos = pq.gastos.reduce((a, r) => a + num(r.costo), 0);
  const costo = num(pq.tu_pago) + equipo + edicion + gastos;
  const minimo = Math.round(costo * 1.10);                       // costo + 10% para imprevistos
  const sugerido = costo ? redondear(minimo * (1 + num(pq.margen) / 100)) : 0;
  const precio = pq.precio === '' || pq.precio == null ? sugerido : num(pq.precio);
  const ganancia = precio - costo;
  const total = imp && imp.activo ? Math.round(precio * (1 + num(imp.pct) / 100)) : precio;
  return { equipo, edicion, gastos, costo, minimo, sugerido, precio, ganancia, total, anticipo: Math.round(total / 2) };
}

          ${C.paquetes.length < MAX_PAQUETES ? '<button type="button" class="cot-tab mas" data-agregar-paquete>+ Otro paquete</button>' : ''}

          </div>

        </div>

        ${C.paquetes.length > 1 ? `
          <div class="cot-bloque">
            <div class="cot-titulo">¿Cuál paquete cuenta en tu tablero?</div>
            <div class="chips">${C.paquetes.map((x, i) => `<button type="button" class="chip ${C.elegido === i ? 'on' : ''}" data-elegido="${i}"><span data-nombre-paq="${i}">${esc(x.nombre) || 'Paquete ' + (i + 1)}</span> · <span data-r-total="${i}"></span></button>`).join('')}</div>
            <div class="ayuda" style="margin-top:6px;">Cuando tu cliente elija, márcalo aquí: ese será el monto del proyecto.</div>
          </div>` : ''}

        <div class="modal-pie"><div class="der">
          <button class="btn ghost" data-cerrar>Cancelar</button>
          <button class="btn ghost" data-pdf>📄 Descargar PDF</button>
          <button class="btn" data-guardar-cot>Guardar cotización</button>
        </div></div>
      </div>`;
    pintar();
  }

  // Actualiza solo los números (sin redibujar, para no perder el cursor al escribir)
  function pintar(){
    const P = pq();
    const r = calcularPaquete(P, C.impuesto);
    const set = (k, v) => { const el = bg.querySelector(`[data-r="${k}"]`); if(el) el.textContent = v; };
    set('costo', dinero(r.costo));
    set('minimo', dinero(r.minimo));
    set('sugerido', dinero(r.sugerido));
    set('margen', P.margen + '%');
    set('margen-txt', `con ${P.margen}% de ganancia`);
    set('total', dinero(r.total));
    set('anticipo', `Anticipo 50%: ${dinero(r.anticipo)}`);
    const g = bg.querySelector('[data-r="ganancia"]');
    if(!r.costo) { g.className = 'cot-ganancia'; g.textContent = 'Llena los costos de arriba y aquí verás cuánto ganas.'; }
    else if(r.precio < r.costo){ g.className = 'cot-ganancia mal'; g.textContent = `⚠️ Con este precio pierdes ${dinero(r.costo - r.precio)}.`; }
    else if(r.precio < r.minimo){ g.className = 'cot-ganancia ojo'; g.textContent = `Ganas ${dinero(r.ganancia)} además de tu pago, pero no te queda colchón para imprevistos.`; }
    else { g.className = 'cot-ganancia bien'; g.innerHTML = `✓ Ganas ${dinero(r.ganancia)} además de tu pago (${Math.round(r.ganancia / r.precio * 100)}% del precio).<span class="cot-tip">Esto guárdalo para que tu negocio crezca. 🌱</span>`; }
    const pr = bg.querySelector('[data-r-placeholder]');
    if(pr) pr.placeholder = r.sugerido ? String(r.sugerido) : 'Precio';
    bg.querySelectorAll('[data-r-total]').forEach(el => { el.textContent = dinero(calcularPaquete(C.paquetes[+el.dataset.rTotal], C.impuesto).total); });
  }

  bg.addEventListener('input', e => {
    const t = e.target;
    if(t.dataset.k){
      const partes = t.dataset.k.split('.');
      let obj = pq();
      while(partes.length > 1) obj = obj[partes.shift()];
      obj[partes[0]] = t.value;
      if(t.dataset.k === 'nombre'){
        const tab = bg.querySelector(`[data-tab="${actual}"]`); if(tab) tab.textContent = t.value || 'Paquete ' + (actual + 1);
        bg.querySelectorAll(`[data-nombre-paq="${actual}"]`).forEach(el => { el.textContent = t.value || 'Paquete ' + (actual + 1); });
      }
      pintar();
    }
    if(t.dataset.g === 'pct'){ C.impuesto.pct = t.value; pintar(); }
    if(t.dataset.gp){ C.pdf[t.dataset.gp] = t.value; }
  });
  bg.addEventListener('change', e => {
    const t = e.target;
    if(t.dataset.g === 'imp'){ C.impuesto.activo = t.checked; bg.querySelector('[data-g="pct"]').disabled = !t.checked; pintar(); }
    if(t.dataset.moneda !== undefined){ ponerMoneda(t.value); guardarMoneda(t.value); pintar(); }
  });
  bg.addEventListener('click', e => {
    const t = e.target.closest('button');
    if(e.target === bg || (t && t.dataset.cerrar !== undefined)){ cerrar(); return; }
    if(!t) return;
    const d = t.dataset;
    if(d.tipo){
      const vacio = C.paquetes.every(x => !num(x.tu_pago) && [...x.equipo, ...x.edicion, ...x.gastos].every(r => !num(r.pago) && !num(r.costo)));
      C.tipo = d.tipo;
      // Si todavía no capturó montos, cargamos los puestos típicos del tipo elegido
      if(vacio) C.paquetes = C.paquetes.map((x, i) => ({ ...paqueteDesdePlantilla(d.tipo, x.nombre), margen:x.margen }));
      render();
    }
    if(d.tab){ actual = +d.tab; render(); }
    if(d.agregarPaquete !== undefined){
      const copia = JSON.parse(JSON.stringify(pq()));
      copia.nombre = 'Paquete ' + (C.paquetes.length + 1);
      C.paquetes.push(copia);
      actual = C.paquetes.length - 1;
      render();
      toast('Copiamos el paquete anterior para que solo ajustes lo que cambia');
    }
    if(d.borrarPaquete !== undefined){
      C.paquetes.splice(actual, 1);
      if(C.elegido >= C.paquetes.length) C.elegido = 0;
      actual = Math.max(0, actual - 1);
      render();
    }
    if(d.solo){ pq().solo = d.solo === '1'; render(); }
    if(d.agregar){
      const nuevo = d.agregar === 'equipo' ? { puesto:'', cant:1, pago:'' } : { concepto:'', costo:'' };
      pq()[d.agregar].push(nuevo);
      render();
      const inputs = bg.querySelectorAll(`[data-k^="${d.agregar}.${pq()[d.agregar].length - 1}."]`);
      if(inputs[0]) inputs[0].focus();
    }
    if(d.quitar){ const [campo, i] = d.quitar.split('.'); pq()[campo].splice(+i, 1); render(); }
    if(d.elegido){ C.elegido = +d.elegido; render(); }
    if(d.negocio !== undefined){ abrirMiNegocio(render); }
    if(d.rellenar !== undefined){ pq().incluye = incluyeSugerido(pq()); render(); }
    if(d.pdf !== undefined){
      const elegido = calcularPaquete(C.paquetes[C.elegido], C.impuesto);
      guardar({ id:p.id, cotizacion:C, monto_total:elegido.total, tipo: C.tipo || p.tipo });
      t.disabled = true; t.textContent = 'Preparando…';
      descargarPDF(p, C).finally(() => { t.disabled = false; t.textContent = '📄 Descargar PDF'; });
    }
    if(d.guardarCot !== undefined){
      const elegido = calcularPaquete(C.paquetes[C.elegido], C.impuesto);
      cerrar();
      guardar({ id:p.id, cotizacion:C, monto_total:elegido.total, tipo: C.tipo || p.tipo }, { msg:'Cotización guardada' });
    }
  });
  render();
}

const COLORES_MARCA = ['#0a0908','#c72a09','#d9a916','#1a8f4c','#2f6fbf','#7a4fb5','#d6457a','#0f8b8d'];

// Reduce el logo para que pese poco (se guarda junto con su tablero)
function procesarLogo(file){
  return new Promise((ok, mal) => {
    const lector = new FileReader();
    lector.onerror = mal;
    lector.onload = () => {
      const img = new Image();
      img.onerror = mal;
      img.onload = () => {
        const max = 500, esc_ = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * esc_); c.height = Math.round(img.height * esc_);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const esPng = /png|svg|webp|gif/.test(file.type);
        ok(esPng ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.85));
      };
      img.src = lector.result;
    };
    lector.readAsDataURL(file);
  });
}

let _jspdf = null;
function cargarJsPDF(){
  if(_jspdf) return _jspdf;
  _jspdf = new Promise((ok, mal) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload = () => ok(window.jspdf.jsPDF);
    s.onerror = () => { _jspdf = null; mal(new Error('jsPDF')); };
    document.head.appendChild(s);
  });
  return _jspdf;
}

// En el PDF usamos el código de moneda (las fuentes del PDF no traen todos los símbolos)
function pdfDinero(n){
  const conPeso = ['MXN','USD','COP','ARS','CLP','UYU'].includes(MONEDA);
  return (conPeso ? '$' : '') + Math.round(Number(n) || 0).toLocaleString('es-MX') + ' ' + MONEDA;
}
function hexRgb(h){ const m = /^#?([0-9a-f]{6})$/i.exec(h || ''); const v = parseInt(m ? m[1] : '0a0908', 16); return [v >> 16, (v >> 8) & 255, v & 255]; }
const aclarar = (rgb, f) => rgb.map(c => Math.round(c + (255 - c) * f));

// Mensaje de bienvenida que abre el PDF (cada quien lo puede editar)
function introSugerida(p, C){
  const nombre = String(p.cliente || '').trim().split(/\s+/)[0];
  const opciones = C.paquetes.length > 1 ? 'las opciones que preparamos para ti' : 'lo que incluye';
  return `${nombre ? 'Hola, ' + nombre + '. G' : 'G'}racias por pensar en nosotros para ${p.nombre || 'tu proyecto'}. `
    + `Preparamos esta propuesta a la medida de lo que nos contaste: aquí encontrarás ${opciones}, la inversión y lo necesario para apartar tu fecha. `
    + 'Si tienes cualquier duda o quieres ajustar algo, con gusto lo platicamos.';
}

// Lo que incluye, armado a partir de lo que se capturó en el cotizador
function incluyeSugerido(pq){
  const lineas = [];
  if(!pq.solo){
    const equipo = pq.equipo.filter(r => r.puesto && num(r.cant) > 0).map(r => num(r.cant) > 1 ? `${r.puesto} (${num(r.cant)})` : r.puesto);
    if(equipo.length) lineas.push('Equipo de producción: ' + equipo.join(', '));
  }
  pq.edicion.filter(r => r.concepto).forEach(r => lineas.push(r.concepto));
  return lineas.join('\n');
}

async function descargarPDF(p, C){
  let jsPDF;
  try { jsPDF = await cargarJsPDF(); }
  catch(e){ toast('No se pudo preparar el PDF. Revisa tu conexión.'); return; }
  const N = T.alumno.negocio || {};
  const marca = hexRgb(N.color);
  const doc = new jsPDF({ unit:'pt', format:'letter' });
  const W = 612, H = 792, M = 48;
  let y = 0;
  const gris = [110, 106, 98], texto = [33, 31, 28];
  const nuevaPagina = alto => { if(y + alto > H - 52){ doc.addPage(); doc.setFillColor(...marca); doc.rect(0, 0, W, 6, 'F'); y = M; } };

  // Encabezado
  doc.setFillColor(...marca); doc.rect(0, 0, W, 8, 'F');
  y = M;
  let altoMarca = 0;
  if(N.logo){
    try {
      const props = doc.getImageProperties(N.logo);
      const r = Math.min(170 / props.width, 64 / props.height);
      doc.addImage(N.logo, N.logo.includes('image/png') ? 'PNG' : 'JPEG', M, y, props.width * r, props.height * r);
      altoMarca = props.height * r;
    } catch(e){}
  }
  if(!altoMarca && N.nombre){
    doc.setFont('helvetica', 'bold'); doc.setFontSize(20); doc.setTextColor(...marca);
    doc.text(N.nombre, M, y + 20); altoMarca = 26;
  }
  doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.setTextColor(...texto);
  doc.text('COTIZACIÓN', W - M, y + 16, { align:'right' });
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(...gris);
  doc.text('Folio ' + C.pdf.folio, W - M, y + 32, { align:'right' });
  doc.text(new Date().toLocaleDateString('es-MX', { day:'numeric', month:'long', year:'numeric' }), W - M, y + 45, { align:'right' });
  y += Math.max(altoMarca, 50) + 22;
  doc.setDrawColor(228, 223, 214); doc.line(M, y, W - M, y);
  y += 30;

  // Mensaje de bienvenida
  const intro = (C.pdf.intro != null ? C.pdf.intro : introSugerida(p, C)).trim();
  if(intro){
    doc.setFont('helvetica', 'normal'); doc.setFontSize(11.5); doc.setTextColor(...texto);
    const li = doc.splitTextToSize(intro, W - 2 * M);
    doc.text(li, M, y, { lineHeightFactor: 1.45 });
    y += li.length * 11.5 * 1.45 + 16;
  }

  // Datos del proyecto
  const dato = (etq, val) => {
    if(!val) return;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(...gris);
    doc.text(etq.toUpperCase(), M, y);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(12); doc.setTextColor(...texto);
    doc.text(String(val), M + 120, y);
    y += 18;
  };
  dato('Para', p.cliente);
  dato('Proyecto', p.nombre);
  dato('Servicio', C.tipo);
  if(C.pdf.fecha_evento) dato('Fecha', new Date(C.pdf.fecha_evento + 'T12:00:00').toLocaleDateString('es-MX', { day:'numeric', month:'long', year:'numeric' }));
  y += 8;

  // Paquetes
  C.paquetes.forEach((pq, i) => {
    const r = calcularPaquete(pq, C.impuesto);
    const items = (pq.incluye != null ? pq.incluye : incluyeSugerido(pq)).split('\n').map(s => s.trim()).filter(Boolean);
    doc.setFontSize(10.5);
    const lineas = items.flatMap(it => doc.splitTextToSize(it, W - 2 * M - 46));
    const alto = 56 + lineas.length * 14 + (items.length ? 8 : 0) + 16;
    nuevaPagina(alto);
    doc.setFillColor(...aclarar(marca, 0.92)); doc.setDrawColor(...aclarar(marca, 0.7));
    doc.roundedRect(M, y, W - 2 * M, alto, 8, 8, 'FD');
    doc.setFillColor(...marca); doc.roundedRect(M, y, 5, alto, 2, 2, 'F');
    let yy = y + 28;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.setTextColor(...texto);
    doc.text(pq.nombre || (C.paquetes.length > 1 ? 'Opción ' + (i + 1) : 'Propuesta'), M + 20, yy);
    doc.setFontSize(17); doc.setTextColor(...marca);
    doc.text(pdfDinero(r.total), W - M - 18, yy, { align:'right' });
    yy += 16;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...gris);
    doc.text(C.impuesto.activo ? `${pdfDinero(r.precio)} + IVA (${num(C.impuesto.pct)}%)` : 'Precio total', W - M - 18, yy, { align:'right' });
    if(items.length){
      yy += 10;
      doc.setFontSize(10.5); doc.setTextColor(...texto);
      items.forEach(it => {
        const ls = doc.splitTextToSize(it, W - 2 * M - 46);
        doc.setTextColor(...marca); doc.text('•', M + 20, yy + 8);
        doc.setTextColor(...texto); doc.text(ls, M + 32, yy + 8);
        yy += ls.length * 14;
      });
    }
    doc.setFontSize(9.5); doc.setTextColor(...gris);
    doc.text(`Anticipo para apartar (50%): ${pdfDinero(r.anticipo)}`, M + 20, y + alto - 14);
    y += alto + 12;
  });

  // Cierre: "Sobre tu negocio" y condiciones, lado a lado para que quepa en una hoja
  const vence = new Date(); vence.setDate(vence.getDate() + (num(C.pdf.vigencia) || 15));
  const condiciones = [C.pdf.notas, `Esta cotización es válida por ${num(C.pdf.vigencia) || 15} días (hasta el ${vence.toLocaleDateString('es-MX', { day:'numeric', month:'long', year:'numeric' })}).`].filter(Boolean).join('\n');
  const columnas = [N.sobre && ['Sobre ' + (N.nombre || 'nosotros'), N.sobre], ['Condiciones', condiciones]].filter(Boolean);
  const anchoCol = columnas.length > 1 ? (W - 2 * M - 24) / 2 : W - 2 * M;
  doc.setFontSize(9.5);
  const bloques = columnas.map(([t, txt]) => [t, doc.splitTextToSize(txt, anchoCol)]);
  nuevaPagina(26 + Math.max(...bloques.map(([, l]) => l.length)) * 13);
  y += 16;
  bloques.forEach(([t, l], i) => {
    const x = M + i * (anchoCol + 24);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(...texto);
    doc.text(t, x, y);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(...gris);
    doc.text(l, x, y + 15, { lineHeightFactor: 1.35 });
  });

  // Pie con datos de contacto en todas las páginas
  const contacto = [N.nombre, N.whatsapp && 'WhatsApp ' + N.whatsapp, N.correo, N.redes].filter(Boolean).join('   ·   ');
  for(let i = 1; i <= doc.getNumberOfPages(); i++){
    doc.setPage(i);
    doc.setFillColor(...marca); doc.rect(0, H - 8, W, 8, 'F');
    if(contacto){ doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...gris); doc.text(contacto, W / 2, H - 26, { align:'center' }); }
  }

  // Sin acentos en el nombre del archivo: algunos navegadores lo descartan y lo llaman "download"
  const nombreArchivo = ('Cotizacion ' + (p.cliente || p.nombre || '')).normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^\w -]/g, '').trim().replace(/\s+/g, '-') + '.pdf';
  const blob = doc.output('blob');
  const archivo = new File([blob], nombreArchivo, { type:'application/pdf' });
  // En celular, abre "Compartir" para mandarlo directo por WhatsApp; si no se puede, se descarga
  if(window.matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({ files:[archivo] })){
    try { await navigator.share({ files:[archivo], title:nombreArchivo }); return; }
    catch(e){ if(e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nombreArchivo;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

// ============================================================
// Preguntas paso a paso → mapa de anillos (como los de un árbol) con el nombre al centro:
// el anillo más cercano es la prioridad 1. Se descarga en PDF y como fondo de pantalla.
const COSMOVISION_DEF = 'Una cosmovisión (del alemán Weltanschauung) es la imagen, el concepto general o el marco interpretativo a través del cual una persona, época o cultura percibe, comprende y explica la realidad, la naturaleza, el universo y el lugar que ocupa el ser humano en él.';
const SI_PAPEL = '#f3ede3', SI_TINTA = '#2b2620';
const SI_COLORES = ['#7f9a6b', '#d4a537', '#c8613a', '#5a7a95', '#c99295', '#3f7f7a', '#8a6a8f', '#a39a55', '#b5793f', '#6f8fb0'];
const SI_PRIORIDADES = ['Yo', 'Familia', 'Amigos', 'Pareja', 'Salud', 'Negocio', 'Proyecto personal', 'Espiritualidad'];

const siColor = i => SI_COLORES[i % SI_COLORES.length];

function abrirSistemaInterno(){
  const previo = T.alumno.sistema;
  const S = previo ? JSON.parse(JSON.stringify(previo)) : {
    nombre: String(T.alumno.nombre || '').split(' ')[0], prioridades: [], centro: '', exito: ''
  };
  let paso = previo ? 'resultado' : 'intro';
  const bg = document.createElement('div');
  bg.className = 'si-bg';
  document.body.appendChild(bg);
  document.body.style.overflow = 'hidden';
  const cerrar = () => { bg.remove(); document.body.style.overflow = ''; renderTablero(); };
  const pasos = () => ['intro', 'nombre', 'prioridades', ...S.prioridades.map((_, i) => 'p' + i), 'centro', 'exito', 'resultado'];

  function render(){
    const lista = pasos();
    const idx = lista.indexOf(paso);
    const progreso = paso === 'resultado' ? '' : `<div class="si-progreso"><div style="width:${Math.round(idx / (lista.length - 1) * 100)}%"></div></div>`;
    let cuerpo = '';
    if(paso === 'intro') cuerpo = `
      <div class="si-eyebrow">Sistema interno</div>
      <h2>Para avanzar en tu trabajo, primero tienes que estar bien contigo.</h2>
      <p class="si-def"><em>${COSMOVISION_DEF}</em></p>
      <p>Tu cosmovisión es tu mapa: cómo funcionas tú. Vamos a descubrir tus prioridades, qué haces para cuidar cada una y qué te regresa a tu centro cuando las cosas se ponen difíciles. Al final te llevas tu mapa.</p>`;
    else if(paso === 'nombre') cuerpo = `
      <div class="si-eyebrow">Tu centro</div>
      <h2>¿Cómo te llamas?</h2>
      <p>En el centro de tu mapa estás tú.</p>
      <input class="si-input" data-s="nombre" value="${esc(S.nombre)}" placeholder="Tu nombre">`;
    else if(paso === 'prioridades') cuerpo = `
      <div class="si-eyebrow">Tus prioridades</div>
      <h2>¿Qué es prioridad en tu vida?</h2>
      <p>Elige las que quieras, o escribe las tuyas. Luego ordénalas: la número 1 es la más cercana a ti.</p>
      <div class="chips si-chips">${SI_PRIORIDADES.map(p => `<button type="button" class="chip ${S.prioridades.some(x => x.nombre === p) ? 'on' : ''}" data-toggle="${esc(p)}">${esc(p)}</button>`).join('')}</div>
      <div class="si-otra"><input class="si-input" id="si-otra" placeholder="Otra prioridad. Ej. Mi perro, el cine, mi comunidad"><button type="button" class="btn" data-agregar>Agregar</button></div>
      <ol class="si-orden">${S.prioridades.map((p, i) => `
        <li><span class="si-num" style="background:${siColor(i)}">${i + 1}</span><span class="si-nom">${esc(p.nombre)}</span>
          <button type="button" data-subir="${i}" ${i === 0 ? 'disabled' : ''} title="Subir">↑</button>
          <button type="button" data-bajar="${i}" ${i === S.prioridades.length - 1 ? 'disabled' : ''} title="Bajar">↓</button>
          <button type="button" data-quitar="${i}" title="Quitar">✕</button></li>`).join('')}</ol>`;
    else if(paso.startsWith('p')){
      const i = +paso.slice(1), P = S.prioridades[i];
      cuerpo = `
        <div class="si-eyebrow"><span class="si-num" style="background:${siColor(i)}">${i + 1}</span> Prioridad ${i + 1} de ${S.prioridades.length} · ${esc(P.nombre)}</div>
        <h2>${esc(siPregunta(P.nombre))}</h2>
        <p>Escribe lo que haces, una cosa por renglón. Estas acciones son las que te mantienen bien en esta parte de tu vida.</p>
        <textarea class="si-input si-area" data-accion="${i}" rows="6" placeholder="Ej. ${esc(siIdeas(P.nombre)[0])}">${esc((P.acciones || []).join('\n'))}</textarea>
        <div class="si-ideas-tit">Ideas</div>
        <div class="chips si-chips">${siIdeas(P.nombre).map(t => `<button type="button" class="chip" data-idea="${esc(t)}">+ ${esc(t)}</button>`).join('')}</div>`;
    }
    else if(paso === 'centro') cuerpo = `
      <div class="si-eyebrow">Tu centro</div>
      <h2>¿Qué te regresa a tu centro en un mal día?</h2>
      <p>Eso que, cuando todo se complica, te devuelve a ti.</p>
      <textarea class="si-input si-area" data-s="centro" rows="5" placeholder="Ej. Salir a caminar sin celular y escribir lo que siento.">${esc(S.centro)}</textarea>`;
    else if(paso === 'exito') cuerpo = `
      <div class="si-eyebrow">Tu definición</div>
      <h2>¿Cuál es tu definición de éxito?</h2>
      <p>Para cada persona es diferente. La tuya es solo tuya: tenla presente para no compararte con nadie. Va a acompañar tu mapa en la esquina.</p>
      <textarea class="si-input si-area" data-s="exito" rows="4" placeholder="Ej. Hacer lo que amo, con tiempo para las personas que quiero.">${esc(S.exito)}</textarea>`;
    else if(paso === 'resultado') cuerpo = `
      <div class="si-eyebrow">Tu sistema interno</div>
      <h2>La cosmovisión de ${esc(S.nombre)}</h2>
      <div class="si-mapa" id="si-mapa"><div class="cargando">Dibujando tu mapa…</div></div>
      <div class="si-acciones">
        <button class="btn" data-pdf>📄 Descargar PDF</button>
        <button class="btn ghost" data-fondo>📱 Fondo de pantalla</button>
        <button class="btn ghost" data-editar>✏️ Editar</button>
      </div>
      <div class="si-lista">${S.prioridades.map((p, i) => `
        <div class="si-item"><div class="si-item-tit"><span class="si-num" style="background:${siColor(i)}">${i + 1}</span>${esc(p.nombre)}</div>
          <ul>${(p.acciones || []).map(a => `<li>${esc(a)}</li>`).join('') || '<li class="si-vacio">Sin acciones todavía</li>'}</ul></div>`).join('')}
        ${S.centro ? `<div class="si-item"><div class="si-item-tit">Lo que me regresa a mi centro</div><p>${esc(S.centro)}</p></div>` : ''}
      </div>`;

    const ultimo = paso === 'exito';
    bg.innerHTML = `
      <div class="si-panel ${paso === 'resultado' ? 'ancho' : ''}">
        <button class="si-x" data-cerrar title="Cerrar">✕</button>
        ${progreso}
        <div class="si-cuerpo">${cuerpo}</div>
        ${paso === 'resultado' ? '' : `
          <div class="si-pie">
            ${idx > 0 ? '<button class="btn ghost" data-atras>← Atrás</button>' : '<span></span>'}
            <button class="btn" data-sig>${paso === 'intro' ? 'Empezar' : ultimo ? 'Ver mi mapa ✨' : 'Siguiente →'}</button>
          </div>`}
      </div>`;
    if(paso === 'resultado') pintarResultado();
    const foco = bg.querySelector('.si-input'); if(foco && paso !== 'prioridades') foco.focus();
  }

  async function pintarResultado(){
    await siFuentes();
    const c = siPaginaMapa(S, 1000, 1000);
    const cont = bg.querySelector('#si-mapa');
    if(cont){ cont.innerHTML = ''; c.className = 'si-canvas'; cont.appendChild(c); }
  }

  function validar(){
    if(paso === 'nombre' && !S.nombre.trim()){ toast('Escribe tu nombre'); return false; }
    if(paso === 'prioridades' && !S.prioridades.length){ toast('Elige al menos una prioridad'); return false; }
    return true;
  }

  async function guardarSistema(){
    S.actualizado = new Date().toISOString();
    const { data, error } = await sb.rpc('taller_guardar_sistema', { p_token: T.token, p_pin: T.pin, p_sistema: S });
    if(pinRechazado(data)){ bg.remove(); document.body.style.overflow = ''; return; }
    if(error){ toast('No se pudo guardar tu mapa. Revisa tu conexión.'); return; }
    T.alumno.sistema = JSON.parse(JSON.stringify(S));
  }

  bg.addEventListener('input', e => {
    const t = e.target;
    if(t.dataset.s) S[t.dataset.s] = t.value;
    if(t.dataset.accion !== undefined) S.prioridades[+t.dataset.accion].acciones = t.value.split('\n').map(x => x.trim()).filter(Boolean);
  });
  bg.addEventListener('keydown', e => {
    if(e.key === 'Enter' && e.target.id === 'si-otra'){ e.preventDefault(); bg.querySelector('[data-agregar]').click(); }
  });
  bg.addEventListener('click', async e => {
    const t = e.target.closest('button');
    if(!t) return;
    const d = t.dataset;
    if(d.cerrar !== undefined){ cerrar(); return; }
    if(d.toggle){
      const i = S.prioridades.findIndex(x => x.nombre === d.toggle);
      if(i >= 0) S.prioridades.splice(i, 1); else S.prioridades.push({ nombre: d.toggle, acciones: [] });
      render();
    }
    if(d.agregar !== undefined){
      const inp = bg.querySelector('#si-otra');
      const v = inp.value.trim();
      if(v && !S.prioridades.some(x => x.nombre.toLowerCase() === v.toLowerCase())) S.prioridades.push({ nombre: v, acciones: [] });
      render();
      const otra = bg.querySelector('#si-otra'); if(otra) otra.focus();
    }
    const mover = (i, j) => { const [x] = S.prioridades.splice(i, 1); S.prioridades.splice(j, 0, x); render(); };
    if(d.subir) mover(+d.subir, +d.subir - 1);
    if(d.bajar) mover(+d.bajar, +d.bajar + 1);
    if(d.quitar){ S.prioridades.splice(+d.quitar, 1); render(); }
    if(d.idea){
      const area = bg.querySelector('[data-accion]');
      const i = +area.dataset.accion;
      const acc = S.prioridades[i].acciones || [];
      if(!acc.includes(d.idea)) acc.push(d.idea);
      S.prioridades[i].acciones = acc;
      area.value = acc.join('\n');
      t.classList.add('on');
    }
    if(d.atras !== undefined){ const l = pasos(); paso = l[Math.max(0, l.indexOf(paso) - 1)]; render(); }
    if(d.sig !== undefined){
      if(!validar()) return;
      const l = pasos(); paso = l[l.indexOf(paso) + 1];
      if(paso === 'resultado') await guardarSistema();
      render();
    }
    if(d.editar !== undefined){ paso = 'nombre'; render(); }
    if(d.pdf !== undefined){ t.disabled = true; t.textContent = 'Preparando…'; await siDescargarPDF(S); t.disabled = false; t.textContent = '📄 Descargar PDF'; }
    if(d.fondo !== undefined){ t.disabled = true; await siDescargarFondo(S); t.disabled = false; }
  });
  render();
}

// ---------- Dibujo (canvas) ----------
let _siFuentes = null;
function siFuentes(){
  if(!_siFuentes) _siFuentes = Promise.all([
    'italic 400 40px "Cormorant Garamond"', '600 40px "Cormorant Garamond"', '500 40px "Cormorant Garamond"', '600 20px Montserrat'
  ].map(f => document.fonts.load(f).catch(() => null)));
  return _siFuentes;
}
// Aleatorio con semilla: el mismo nombre siempre dibuja el mismo mapa
function siRandom(semilla){
  let h = 1779033703;
  for(const ch of String(semilla)) h = Math.imul(h ^ ch.charCodeAt(0), 3432918353), h = h << 13 | h >>> 19;
  return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; };
}
// Contorno orgánico, como el anillo de un tronco
function siContorno(ctx, cx, cy, r, amp, rnd, reversa){
  const f = [2 + Math.floor(rnd() * 2), 4 + Math.floor(rnd() * 3), 7 + Math.floor(rnd() * 4)];
  const ph = f.map(() => rnd() * Math.PI * 2);
  const pts = 160;
  for(let k = 0; k <= pts; k++){
    const a = (reversa ? -1 : 1) * k / pts * Math.PI * 2;
    const rr = r + amp * (Math.sin(f[0] * a + ph[0]) * .55 + Math.sin(f[1] * a + ph[1]) * .3 + Math.sin(f[2] * a + ph[2]) * .15);
    const x = cx + rr * Math.cos(a), y = cy + rr * Math.sin(a);
    if(k === 0 && !reversa) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}
function siHexA(hex, a){ const v = parseInt(hex.slice(1), 16); return `rgba(${v >> 16},${(v >> 8) & 255},${v & 255},${a})`; }
function siGrano(ctx, w, h, rnd){
  const n = document.createElement('canvas'); n.width = n.height = 160;
  const nc = n.getContext('2d'), img = nc.createImageData(160, 160);
  for(let i = 0; i < img.data.length; i += 4){ const v = 90 + rnd() * 90; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = rnd() * 22; }
  nc.putImageData(img, 0, 0);
  ctx.save(); ctx.fillStyle = ctx.createPattern(n, 'repeat'); ctx.fillRect(0, 0, w, h); ctx.restore();
}
function siTexto(ctx, txt, x, y, ancho, alto, alinear){
  // Escribe con saltos de línea automáticos; devuelve la y final
  const lineas = [];
  String(txt).split('\n').forEach(par => {
    let l = '';
    par.split(' ').forEach(p => { const prueba = l ? l + ' ' + p : p; if(ctx.measureText(prueba).width > ancho && l){ lineas.push(l); l = p; } else l = prueba; });
    lineas.push(l);
  });
  ctx.textAlign = alinear || 'left';
  lineas.forEach((l, i) => ctx.fillText(l, x, y + i * alto));
  return y + lineas.length * alto;
}
function siLineasDe(ctx, txt, ancho){ let n = 0; String(txt).split('\n').forEach(par => { let l = ''; par.split(' ').forEach(p => { const pr = l ? l + ' ' + p : p; if(ctx.measureText(pr).width > ancho && l){ n++; l = p; } else l = pr; }); n++; }); return n; }

// El mapa: nombre al centro y un anillo por prioridad
function siDibujarMapa(ctx, S, x0, y0, tam){
  const s = tam / 1000, cx = x0 + tam / 2, cy = y0 + tam / 2;
  const n = Math.max(1, S.prioridades.length);
  const r0 = 120 * s, rMax = 470 * s, w = (rMax - r0) / n;
  const rnd = siRandom(S.nombre + n);
  ctx.save();
  // Acuarela de cada anillo (varias capas translúcidas con bordes que no coinciden)
  ctx.globalCompositeOperation = 'multiply';
  for(let i = n - 1; i >= 0; i--){
    const col = siColor(i);
    for(let capa = 0; capa < 4; capa++){
      ctx.beginPath();
      siContorno(ctx, cx + (rnd() - .5) * 8 * s, cy + (rnd() - .5) * 8 * s, r0 + w * (i + 1) + (rnd() - .3) * 6 * s, 9 * s, rnd);
      siContorno(ctx, cx, cy, r0 + w * i + 4 * s, 7 * s, rnd, true);
      ctx.fillStyle = siHexA(col, .13 + rnd() * .06);
      ctx.fill('evenodd');
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  // Líneas de tinta, como los anillos de crecimiento
  for(let i = 0; i < n; i++){
    const lineas = Math.max(2, Math.min(5, Math.round(w / (14 * s))));
    for(let j = 1; j <= lineas; j++){
      ctx.beginPath();
      siContorno(ctx, cx, cy, r0 + w * i + w * j / (lineas + 1), (3 + rnd() * 4) * s, rnd);
      ctx.strokeStyle = siHexA('#2b2620', .22 + rnd() * .18); ctx.lineWidth = (0.8 + rnd() * .7) * s; ctx.stroke();
    }
    ctx.beginPath();
    siContorno(ctx, cx, cy, r0 + w * (i + 1), 6 * s, rnd);
    ctx.strokeStyle = siHexA('#2b2620', .75); ctx.lineWidth = 2 * s; ctx.stroke();
  }
  // Corazón del tronco y nombre
  ctx.beginPath(); siContorno(ctx, cx, cy, r0, 4 * s, rnd); ctx.fillStyle = SI_PAPEL; ctx.fill();
  ctx.strokeStyle = siHexA('#2b2620', .85); ctx.lineWidth = 2.2 * s; ctx.stroke();
  for(let k = 1; k <= 3; k++){ ctx.beginPath(); siContorno(ctx, cx, cy, r0 * (1 - k * .07), 2.5 * s, rnd); ctx.strokeStyle = siHexA('#2b2620', .12); ctx.lineWidth = s; ctx.stroke(); }
  ctx.fillStyle = siHexA('#2b2620', .55); ctx.font = `600 ${15 * s}px Montserrat`; ctx.textAlign = 'center';
  ctx.fillText('C E N T R O', cx, cy - 30 * s);
  ctx.fillStyle = SI_TINTA;
  let tamNom = 62 * s; ctx.font = `italic 500 ${tamNom}px "Cormorant Garamond"`;
  while(ctx.measureText(S.nombre).width > r0 * 1.7 && tamNom > 24 * s){ tamNom -= 2 * s; ctx.font = `italic 500 ${tamNom}px "Cormorant Garamond"`; }
  ctx.fillText(S.nombre, cx, cy + tamNom * .35 + 8 * s);
  // En cada anillo: su nombre y, siguiendo la curva, lo que haces para cuidarlo
  const base = -Math.PI / 2;
  S.prioridades.forEach((p, i) => {
    const a = base + i * 0.9;
    const rm = r0 + w * (i + .5);
    const px = cx + rm * Math.cos(a), py = cy + rm * Math.sin(a);
    const etq = `${i + 1} · ${p.nombre}`;
    const fe = Math.min(26 * s, w * .5);
    ctx.font = `600 ${fe}px "Cormorant Garamond"`;
    const tw = ctx.measureText(etq).width;
    // Texto curvo con las acciones
    const acc = (p.acciones || []).join('   ·   ');
    if(acc){
      const hueco = (tw / 2 + 18 * s) / rm;
      const disponible = Math.PI * 2 * rm - 2 * hueco * rm;
      let fs = Math.min(21 * s, w * .42), txt = acc;
      ctx.font = `italic 500 ${fs}px "Cormorant Garamond"`;
      while(ctx.measureText(txt).width > disponible && fs > 11 * s){ fs -= .5 * s; ctx.font = `italic 500 ${fs}px "Cormorant Garamond"`; }
      while(ctx.measureText(txt).width > disponible && txt.length > 3) txt = txt.slice(0, -2).trimEnd() + '…';
      // Centramos el texto en el espacio que queda libre del anillo
      let ang = a + hueco + (disponible - ctx.measureText(txt).width) / 2 / rm;
      ctx.fillStyle = SI_TINTA; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for(const ch of txt){
        const cw = ctx.measureText(ch).width, mid = ang + cw / 2 / rm;
        ctx.save();
        ctx.translate(cx + rm * Math.cos(mid), cy + rm * Math.sin(mid));
        ctx.rotate(mid + Math.PI / 2);
        ctx.fillText(ch, 0, 0);
        ctx.restore();
        ang += cw / rm;
      }
      ctx.textBaseline = 'alphabetic';
    }
    // Etiqueta con el nombre de la prioridad
    ctx.font = `600 ${fe}px "Cormorant Garamond"`;
    ctx.fillStyle = siHexA(SI_PAPEL, .95);
    ctx.beginPath(); ctx.roundRect(px - tw / 2 - 12 * s, py - fe * .75, tw + 24 * s, fe * 1.4, fe * .7); ctx.fill();
    ctx.strokeStyle = siColor(i); ctx.lineWidth = 2 * s; ctx.stroke();
    ctx.fillStyle = SI_TINTA; ctx.textAlign = 'center'; ctx.fillText(etq, px, py + fe * .3);
  });
  ctx.restore();
}
function siFondo(ctx, w, h, rnd){ ctx.fillStyle = SI_PAPEL; ctx.fillRect(0, 0, w, h); siGrano(ctx, w, h, rnd); }
function siExito(ctx, S, derecha, abajo, ancho, escala){
  if(!S.exito) return;
  ctx.font = `italic 400 ${34 * escala}px "Cormorant Garamond"`;
  const n = siLineasDe(ctx, S.exito, ancho), alto = 40 * escala;
  const y = abajo - (n - 1) * alto;
  ctx.fillStyle = siHexA('#2b2620', .55); ctx.font = `600 ${14 * escala}px Montserrat`; ctx.textAlign = 'right';
  ctx.fillText('MI DEFINICIÓN DE ÉXITO', derecha, y - 44 * escala);
  ctx.strokeStyle = siHexA('#c8613a', .8); ctx.lineWidth = 2 * escala;
  ctx.beginPath(); ctx.moveTo(derecha - 60 * escala, y - 30 * escala); ctx.lineTo(derecha, y - 30 * escala); ctx.stroke();
  ctx.fillStyle = SI_TINTA; ctx.font = `italic 400 ${34 * escala}px "Cormorant Garamond"`;
  siTexto(ctx, S.exito, derecha, y, ancho, alto, 'right');
}
function siPaginaMapa(S, w, h){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  siFondo(ctx, w, h, siRandom('papel'));
  siDibujarMapa(ctx, S, 0, 0, Math.min(w, h));
  return c;
}

// Hojas del PDF (tamaño carta a 150 dpi)
function siHojas(S){
  const W = 1275, H = 1650, M = 110, hojas = [];
  const nueva = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; const ctx = c.getContext('2d'); siFondo(ctx, W, H, siRandom('papel' + hojas.length)); hojas.push(c); encabezado(ctx); return ctx; };
  const encabezado = ctx => {
    ctx.fillStyle = siHexA('#2b2620', .55); ctx.font = '600 15px Montserrat';
    ctx.textAlign = 'left'; ctx.fillText('S I S T E M A   I N T E R N O', M, 90);
    ctx.textAlign = 'right'; ctx.fillText('O R G A N I Z A   T U S   P R O Y E C T O S', W - M, 90);
  };
  // Hoja 1: definición, mapa y éxito
  let ctx = nueva();
  ctx.fillStyle = SI_TINTA; ctx.textAlign = 'left';
  ctx.font = 'italic 400 46px "Cormorant Garamond"'; ctx.fillText('La cosmovisión de', M, 190);
  ctx.font = '600 104px "Cormorant Garamond"'; ctx.fillText(S.nombre, M, 290);
  ctx.fillStyle = '#4a443c'; ctx.font = 'italic 400 27px "Cormorant Garamond"';
  let y = siTexto(ctx, COSMOVISION_DEF + ' Este es tu mapa: cómo funcionas tú.', M, 350, W - 2 * M, 36);
  const tam = Math.min(1000, H - y - 300);
  siDibujarMapa(ctx, S, (W - tam) / 2, y + 10, tam);
  siExito(ctx, S, W - M, H - 110, 620, 1);
  // Hojas siguientes: cada prioridad con lo que haces para cuidarla, en dos columnas
  ctx = nueva();
  ctx.fillStyle = SI_TINTA; ctx.textAlign = 'left'; ctx.font = '600 76px "Cormorant Garamond"'; ctx.fillText('Mis prioridades', M, 210);
  const colW = (W - 2 * M - 70) / 2, limite = H - 300;
  let col = 0, top = 300;
  y = top;
  const bloque = (titulo, color, renglones, num) => {
    ctx.font = 'italic 400 28px "Cormorant Garamond"';
    ctx.font = '600 42px "Cormorant Garamond"';
    const lt = siLineasDe(ctx, titulo, colW - (color ? 66 : 0));
    ctx.font = 'italic 400 28px "Cormorant Garamond"';
    const alto = lt * 48 + 12 + renglones.reduce((acc, r) => acc + siLineasDe(ctx, r, colW - 100) * 35, 0) + 40;
    if(y + alto > limite){
      if(col === 0){ col = 1; y = top; }
      else { siExito(ctx, S, W - M, H - 110, 620, .8); ctx = nueva(); col = 0; top = 200; y = top; }
    }
    const x = M + col * (colW + 70);
    if(color){
      ctx.globalCompositeOperation = 'multiply';
      const rnd = siRandom(titulo);
      for(let k = 0; k < 3; k++){ ctx.beginPath(); siContorno(ctx, x + 22, y - 13, 24 + rnd() * 4, 3, rnd); ctx.fillStyle = siHexA(color, .3); ctx.fill(); }
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = SI_TINTA; ctx.font = '600 22px Montserrat'; ctx.textAlign = 'center'; ctx.fillText(String(num), x + 22, y - 5);
    }
    ctx.fillStyle = SI_TINTA; ctx.font = '600 42px "Cormorant Garamond"';
    y = siTexto(ctx, titulo, color ? x + 66 : x, y, colW - (color ? 66 : 0), 48, 'left') + 4;
    ctx.font = 'italic 400 28px "Cormorant Garamond"'; ctx.fillStyle = '#3d3831';
    renglones.forEach(r => { ctx.textAlign = 'left'; ctx.fillText('—', x + 66, y); y = siTexto(ctx, r, x + 100, y, colW - 100, 35, 'left'); });
    y += 40;
  };
  S.prioridades.forEach((p, i) => bloque(p.nombre, siColor(i), (p.acciones && p.acciones.length) ? p.acciones : ['(Todavía no escribes qué haces para cuidarlo)'], i + 1));
  if(S.centro) bloque('Lo que me regresa a mi centro', null, [S.centro]);
  siExito(ctx, S, W - M, H - 110, 620, .8);
  return hojas;
}

async function siDescargarPDF(S){
  let jsPDF;
  try { [jsPDF] = await Promise.all([cargarJsPDF(), siFuentes()]); }
  catch(e){ toast('No se pudo preparar el PDF. Revisa tu conexión.'); return; }
  const doc = new jsPDF({ unit:'pt', format:'letter' });
  siHojas(S).forEach((c, i) => {
    if(i) doc.addPage();
    doc.addImage(c.toDataURL('image/jpeg', .9), 'JPEG', 0, 0, 612, 792);
  });
  await siEntregar(doc.output('blob'), siArchivo('Sistema interno ' + S.nombre, 'pdf'), 'application/pdf');
}
async function siDescargarFondo(S){
  await siFuentes();
  const W = 1080, H = 1920, c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  siFondo(ctx, W, H, siRandom('fondo'));
  ctx.fillStyle = siHexA('#2b2620', .55); ctx.font = '600 22px Montserrat'; ctx.textAlign = 'center';
  ctx.fillText('M I   S I S T E M A   I N T E R N O', W / 2, 250);
  siDibujarMapa(ctx, S, 40, 360, W - 80);
  siExito(ctx, S, W - 80, H - 240, 760, 1.25);
  const blob = await new Promise(ok => c.toBlob(ok, 'image/png'));
  await siEntregar(blob, siArchivo('Fondo sistema interno ' + S.nombre, 'png'), 'image/png');
}
const siArchivo = (nombre, ext) => nombre.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w -]/g, '').trim().replace(/\s+/g, '-') + '.' + ext;
async function siEntregar(blob, nombre, tipo){
  const archivo = new File([blob], nombre, { type: tipo });
  if(window.matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({ files:[archivo] })){
    try { await navigator.share({ files:[archivo], title:nombre }); return; }
    catch(e){ if(e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function haceCuanto(f){
  if(!f) return 'no ha entrado';
  const dias = Math.floor((Date.now() - new Date(f)) / 86400000);
  if(dias <= 0) return 'entró hoy';
  if(dias === 1) return 'entró ayer';
  return 'entró hace ' + dias + ' días';
}

          ${a.tiene_pin ? `<button class="icono" data-reset="${a.id}" title="Reiniciar PIN">🔑</button>` : ''}
          <button class="icono" data-borrar="${a.id}" title="Borrar">🗑</button>
        </div>`).join('') : `<div class="col-vacia" style="grid-column:1/-1;">${ALUMNOS.length ? 'Nadie coincide con la búsqueda.' : 'Todavía no hay alumnos. Da de alta al primero arriba.'}</div>`}
    </div>`;

  const nombre = document.getElementById('a-nombre');
  const agregar = async () => {
    if(!nombre.value.trim()){ nombre.focus(); return; }
    const btn = document.getElementById('a-agregar');
    btn.disabled = true; btn.textContent = 'Creando…';
    const { data, error } = await sb.rpc('taller_admin_crear_alumno', { p_clave: CLAVE, p_nombre: nombre.value, p_contacto: document.getElementById('a-contacto').value });
    if(error){ btn.disabled = false; btn.textContent = '+ Dar de alta'; toast('No se pudo crear.'); return; }
    ALUMNOS.unshift({ ...data, proyectos_propios: 0 });
    renderAdmin();
    copiar(linkAlumno(data.token));
    toast('Alumno creado. Su link ya está copiado.');
  };
  document.getElementById('a-agregar').addEventListener('click', agregar);
  document.getElementById('a-clave').addEventListener('click', cambiarClave);
  document.getElementById('a-salir').addEventListener('click', () => { guardarClave(null); mostrarEntrada(); });
  [nombre, document.getElementById('a-contacto')].forEach(i => i.addEventListener('keydown', e => { if(e.key === 'Enter') agregar(); }));
  const buscador = document.getElementById('a-buscar');
  buscador.addEventListener('input', () => {
    FILTRO = buscador.value.trim().toLowerCase();
    renderAdmin();
    const b = document.getElementById('a-buscar'); b.focus(); b.setSelectionRange(b.value.length, b.value.length);
  });

  const porId = id => ALUMNOS.find(a => a.id === id);
  app.querySelectorAll('[data-reset]').forEach(b => b.addEventListener('click', async () => {
    const a = porId(b.dataset.reset);
    if(!confirm('¿Reiniciar el PIN de ' + a.nombre + '? La próxima vez que abra su link creará uno nuevo. Su información no se borra.')) return;
    const { error } = await sb.rpc('taller_admin_reiniciar_pin', { p_clave: CLAVE, p_id: a.id });
    if(error){ toast('No se pudo reiniciar.'); return; }
    a.tiene_pin = false;
    renderAdmin();
    toast('PIN reiniciado');
  }));
  app.querySelectorAll('[data-copiar]').forEach(b => b.addEventListener('click', () => copiar(linkAlumno(porId(b.dataset.copiar).token))));
  app.querySelectorAll('[data-wa]').forEach(b => b.addEventListener('click', () => {
    const a = porId(b.dataset.wa);
    const msg = `¡Hola ${String(a.nombre).split(' ')[0]}! 👋 Este es tu tablero de *Organiza tus proyectos*:\n${linkAlumno(a.token)}\n\nEs tuyo: guárdalo en tu celular y úsalo con todos tus proyectos.`;
    const tel = String(a.contacto || '').replace(/\D/g, '');
    const numero = tel.length === 10 ? '52' + tel : tel;
    window.open('https://wa.me/' + (numero.length >= 10 ? numero : '') + '?text=' + encodeURIComponent(msg), '_blank');
  }));
  app.querySelectorAll('[data-borrar]').forEach(b => b.addEventListener('click', async () => {
    const a = porId(b.dataset.borrar);
    if(!confirm('¿Borrar a ' + a.nombre + ' y todo su tablero? Su link dejará de funcionar.')) return;
    const { error } = await sb.rpc('taller_admin_borrar_alumno', { p_clave: CLAVE, p_id: a.id });
    if(error){ toast('No se pudo borrar.'); return; }
    ALUMNOS = ALUMNOS.filter(x => x.id !== a.id);
    renderAdmin();
  }));
}

// ============ Arranque ============
// ?t=TOKEN → tablero del alumno. Sin token → panel de alumnos (pide contraseña).
const params = new URLSearchParams(location.search);
if(params.get('t')) abrirTablero(params.get('t'));
else abrirAdmin();
</script>
</body>

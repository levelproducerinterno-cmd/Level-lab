}

// ============================================================
// ============ CLIENTES MENSUALES (igualas) ====================
// ============================================================
// Cada iguala se da de alta una vez; cada mes se arma solo con sus entregables y su cobro.
// El registro por mes vive en iguala.registro = { 'AAAA-MM': { e:[entregados por renglón], pagado, fecha } }.
const MES_NOMBRES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const mesHoy = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; };
function mesSumar(clave, n){ const [a, m] = clave.split('-').map(Number); const d = new Date(a, m - 1 + n, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; }
function mesDiferencia(desde, hasta){ const [a1, m1] = desde.split('-').map(Number), [a2, m2] = hasta.split('-').map(Number); return (a2 - a1) * 12 + (m2 - m1); }
const mesNombre = clave => { const [a, m] = clave.split('-').map(Number); return `${MES_NOMBRES[m - 1]} ${a}`; };
const igualasActivas = () => (T.negocioIgualas = (T.alumno.negocio || {}).igualas === true || T.igualas.length > 0);

// ¿Esta iguala corre en ese mes? (las inactivas corren hasta el mes en que se desactivaron)
function igualaEnMes(ig, mes){
  if(mes < ig.inicio) return false;
  if(ig.meses && mesDiferencia(ig.inicio, mes) >= ig.meses) return false;
  return !((ig.registro || {})[mes] || {}).pausa;
}
function igualaMes(ig, mes){
  const r = (ig.registro || {})[mes] || {};
  const e = (ig.entregables || []).map((x, i) => Math.min(+x.cantidad || 0, +((r.e || [])[i]) || 0));
  return { e, pagado: !!r.pagado, fecha: r.fecha || '' };
}
function igualaEstadoCobro(ig, mes){
  const m = igualaMes(ig, mes);
  if(m.pagado) return 'pagado';
  const hoy = mesHoy();
  if(mes < hoy) return 'atrasado';
  if(mes === hoy && mes !== ig.inicio && new Date().getDate() > ig.dia_cobro) return 'atrasado';
  return 'pendiente';
}
// Mensualidades sin pagar hasta el mes actual (para Cobranza)
function igualasPorCobrar(){
  const hoy = mesHoy(), lista = [];
  T.igualas.forEach(ig => {
    for(let mes = ig.inicio; mes <= hoy; mes = mesSumar(mes, 1)){
      if(igualaEnMes(ig, mes) && !igualaMes(ig, mes).pagado) lista.push({ ig, mes });
    }
  });
  return lista;
}
const sumaPorCobrarIgualas = () => igualasPorCobrar().reduce((a, x) => a + (+x.ig.monto || 0), 0);

async function guardarIguala(cambios, opts = {}){
  const previa = cambios.id ? { ...T.igualas.find(x => x.id === cambios.id) } : null;
  if(previa) Object.assign(T.igualas.find(x => x.id === cambios.id), cambios);
  if(previa && !opts.sinRender) renderTablero();
  const { data, error } = await sb.rpc('taller_guardar_iguala', { p_token: T.token, p_pin: T.pin, p: cambios });
  if(pinRechazado(data)) return null;
  if(error){
    console.error(error);
    if(previa) Object.assign(T.igualas.find(x => x.id === cambios.id), previa);
    renderTablero(); toast('No se pudo guardar. Revisa tu conexión.');
    return null;
  }
  if(!previa) T.igualas.push(data); else Object.assign(T.igualas.find(x => x.id === data.id), data);
  if(!opts.sinRender) renderTablero(opts.destacar ? 'ig-' + data.id : null);
  if(opts.msg) toast(opts.msg);
  return data;
}

async function activarIgualas(si){
  const negocio = Object.assign({}, T.alumno.negocio || {}, { igualas: si });
  T.alumno.negocio = negocio;
  renderTablero(si ? 'sec-mensuales' : null);
  const { data, error } = await sb.rpc('taller_guardar_negocio', { p_token: T.token, p_pin: T.pin, p_negocio: negocio });
  if(pinRechazado(data)) return;
  if(error) toast('No se pudo guardar tu preferencia.');
}

  return `

      <div class="ig-pregunta-acc"><button class="btn" data-igualas="si">Sí, tengo</button><button class="btn ghost" data-igualas="no">Por ahora no</button></div>

function renderMensuales(){
  const negocio = T.alumno.negocio || {};
  if(!igualasActivas()) return '';
  const mes = T.mesIguala || mesHoy();
  const delMes = T.igualas.filter(ig => igualaEnMes(ig, mes));
  const fijo = delMes.reduce((a, ig) => a + (+ig.monto || 0), 0);
  const cobrado = delMes.filter(ig => igualaMes(ig, mes).pagado).reduce((a, ig) => a + (+ig.monto || 0), 0);
  const pendientes = delMes.reduce((a, ig) => { const m = igualaMes(ig, mes); return a + (ig.entregables || []).reduce((b, x, i) => b + Math.max(0, (+x.cantidad || 0) - m.e[i]), 0); }, 0);
  const pausadas = T.igualas.filter(ig => !ig.activa);
  return `
    <section class="seccion" id="sec-mensuales" style="--c:var(--mensual)">
      <div class="seccion-head"><span class="chip-num">4</span><h2>Clientes mensuales</h2><span class="ig-aparte">Aparte de tus proyectos</span></div>
      <p class="seccion-intro">Tus igualas: cada mes se arma solo con lo que le entregas a cada cliente y su cobro. Marca cada entregable conforme lo entregues y su pago cuando te depositen.</p>
      <div class="ig-barra">
        <div class="ig-mes">
          <button class="icono" data-mes="-1" title="Mes anterior">‹</button>
          <strong>${mesNombre(mes)}</strong>
          <button class="icono" data-mes="1" title="Mes siguiente">›</button>
          ${mes !== mesHoy() ? '<button class="link" data-mes="hoy">Ir a este mes</button>' : ''}
        </div>
        <button class="btn" data-nueva-iguala>+ Nueva iguala</button>
      </div>
      <div class="ig-stats">
        <div><span>Ingreso fijo del mes</span><strong>${dinero(fijo)}</strong></div>
        <div><span>Cobrado</span><strong style="color:var(--cobranza)">${dinero(cobrado)}</strong></div>
        <div><span>Por cobrar</span><strong style="color:${fijo - cobrado > 0 ? 'var(--rojo)' : 'inherit'}">${dinero(fijo - cobrado)}</strong></div>
        <div><span>Entregables pendientes</span><strong>${pendientes}</strong></div>
      </div>
      <div class="ig-grid">
        ${delMes.length ? delMes.map(ig => renderIguala(ig, mes)).join('') : `<div class="col-vacia" style="grid-column:1/-1;">${T.igualas.length ? 'Ninguna iguala corre en este mes.' : 'Da de alta tu primer cliente mensual con <strong>+ Nueva iguala</strong>.'}</div>`}
      </div>
      ${pausadas.length ? `<details class="cobrados"><summary>○ Igualas inactivas · ${pausadas.length}</summary>
        ${pausadas.map(ig => `<div class="cobrado-fila"><span data-editar-iguala="${ig.id}"><strong>${esc(ig.cliente)}</strong> · ${esc(ig.servicio)} · ${dinero(ig.monto)}/mes</span>
          <button class="ig-estado" data-activa="${ig.id}">Reactivar</button></div>`).join('')}</details>` : ''}
    </section>`;
}

function renderIguala(ig, mes){
  const m = igualaMes(ig, mes), estado = igualaEstadoCobro(ig, mes);
  const total = (ig.entregables || []).reduce((a, x) => a + (+x.cantidad || 0), 0);
  const hechos = m.e.reduce((a, b) => a + b, 0);
  const pct = total ? Math.round(hechos / total * 100) : 0;
  let nMes = 0; for(let m = ig.inicio; m <= mes; m = mesSumar(m, 1)) if(igualaEnMes(ig, m)) nMes++;
  const revisar = mes === mesHoy() && mesDiferencia(ig.precio_desde || ig.inicio, mes) >= 6;
  const chip = { pagado:'<span class="ig-chip ok">✓ Pagado</span>', pendiente:`<span class="ig-chip">Cobro el día ${ig.dia_cobro}</span>`, atrasado:`<span class="ig-chip mal">Atrasado · día ${ig.dia_cobro}</span>` }[estado];
  return `
    <div class="card ig-card" data-id="ig-${ig.id}">
      <div class="ig-head" data-editar-iguala="${ig.id}">
        <div><div class="card-nombre">${esc(ig.cliente) || 'Sin nombre'}</div><div class="card-cliente">${esc(ig.servicio)}</div></div>
        <div class="ig-monto">${dinero(ig.monto)}<span>/mes</span></div>
      </div>
      <div class="card-meta">${chip}<span class="fecha">Mes ${nMes}</span>
        <button class="ig-estado ${ig.activa ? 'on' : ''}" data-activa="${ig.id}" title="${ig.activa ? 'Marcar como inactiva' : 'Reactivar'}">${ig.activa ? '● Activa' : '○ Inactiva'}</button></div>
      ${total ? `
        <div class="barra" style="--c:var(--mensual)"><div style="width:${pct}%"></div></div>
        <div class="barra-label"><span>Entregado este mes</span><strong>${hechos} de ${total}</strong></div>
        <div class="ig-entregables">${(ig.entregables || []).map((x, i) => `
          <div class="ig-ent ${m.e[i] >= +x.cantidad ? 'listo' : ''}">
            <span>${esc(x.nombre)}</span>
            <div class="ig-cont">
              <button data-ent="${ig.id}|${i}|-1" ${m.e[i] <= 0 ? 'disabled' : ''}>−</button>
              <strong>${m.e[i]}/${+x.cantidad || 0}</strong>
              <button data-ent="${ig.id}|${i}|1" ${m.e[i] >= +x.cantidad ? 'disabled' : ''}>+</button>
            </div>
          </div>`).join('')}</div>` : ''}
      ${revisar ? `<div class="ig-aviso">💡 Llevas ${mesDiferencia(ig.precio_desde || ig.inicio, mes)} meses con el mismo precio. Revisa si es momento de ajustarlo.<button class="link" data-revisado="${ig.id}">Ya lo revisé</button></div>` : ''}
      <div class="card-acciones">
        ${m.pagado
          ? `<button class="accion sec" data-pago="${ig.id}">✓ Pagado${m.fecha ? ' el ' + fechaBonita(m.fecha) : ''} · deshacer</button>`
          : `<button class="accion" data-pago="${ig.id}">Me pagó ${MES_NOMBRES[+mes.split('-')[1] - 1].toLowerCase()} ✓</button>`}
      </div>
    </div>`;
}

function conectarMensuales(){
  const sec = document.getElementById('sec-mensuales');
  if(!sec) return;
  sec.addEventListener('click', e => {
    const t = e.target.closest('button, [data-editar-iguala]');
    if(!t) return;
    const d = t.dataset, mes = T.mesIguala || mesHoy();
    if(d.mes){ T.mesIguala = d.mes === 'hoy' ? mesHoy() : mesSumar(mes, +d.mes); renderTablero('sec-mensuales'); }
    if(d.nuevaIguala !== undefined) abrirEditorIguala(null);
    if(d.editarIguala) abrirEditorIguala(T.igualas.find(x => x.id === d.editarIguala));
    if(d.ent){
      const [id, i, delta] = d.ent.split('|'), ig = T.igualas.find(x => x.id === id);
      const registro = JSON.parse(JSON.stringify(ig.registro || {})), m = igualaMes(ig, mes);
      m.e[+i] = Math.max(0, Math.min(+ig.entregables[+i].cantidad || 0, m.e[+i] + +delta));
      registro[mes] = Object.assign(registro[mes] || {}, { e: m.e });
      guardarIguala({ id, registro });
    }
    if(d.pago){
      const ig = T.igualas.find(x => x.id === d.pago);
      const registro = JSON.parse(JSON.stringify(ig.registro || {})), m = igualaMes(ig, mes);
      const hoy = new Date();
      registro[mes] = Object.assign(registro[mes] || { e: m.e }, m.pagado ? { pagado:false, fecha:'' } : { pagado:true, fecha:`${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, '0')}-${String(hoy.getDate()).padStart(2, '0')}` });
      guardarIguala({ id: ig.id, registro }, { msg: m.pagado ? 'Pago desmarcado' : '¡Cobrado! 🎉' });
    }
    if(d.activa) cambiarActiva(T.igualas.find(x => x.id === d.activa));
    if(d.revisado) guardarIguala({ id: d.revisado, precio_desde: mesHoy() });
  });
}

// Inactiva: corre hasta este mes (sus pagos pendientes siguen en Cobranza) y deja de aparecer en los siguientes.
// Al reactivarla vuelve a correr desde este mes.
function cambiarActiva(ig){
  if(ig.activa){
    if(!confirm(`¿Marcar la iguala de ${ig.cliente} como inactiva? Deja de aparecer a partir del próximo mes; su historial se guarda.`)) return;
    guardarIguala({ id: ig.id, activa: false, meses: String(mesDiferencia(ig.inicio, mesHoy()) + 1) }, { msg: 'Iguala inactiva' });
  } else {
    // Los meses que estuvo inactiva quedan marcados como pausa, así no cuentan como deuda y el historial se conserva
    const registro = JSON.parse(JSON.stringify(ig.registro || {}));
    if(ig.meses) for(let m = mesSumar(ig.inicio, ig.meses); m < mesHoy(); m = mesSumar(m, 1)) registro[m] = { pausa: true };
    guardarIguala({ id: ig.id, activa: true, meses: '', registro, precio_desde: mesHoy() }, { msg: '¡Iguala activa de nuevo! 🔁', destacar: true });
  }
}

function abrirEditorIguala(ig, desde){
  const nueva = !ig;
  const d = ig ? JSON.parse(JSON.stringify(ig)) : {
    cliente: desde ? desde.cliente : '', servicio: desde ? (desde.nombre || desde.tipo || '') : '',
    monto: desde ? desde.monto_total : '', dia_cobro: 1, inicio: mesHoy(), meses: null,
    entregables: [{ nombre:'Reels', cantidad:8 }], activa: true
  };
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  document.body.appendChild(bg);
  const cerrar = () => bg.remove();
  const filas = () => d.entregables.map((x, i) => `
    <div class="cot-fila">
      <input data-ent-nom="${i}" value="${esc(x.nombre)}" placeholder="Ej. Reels, posts, fotos">
      <label class="cot-campo cot-n"><span class="cot-mini">Cantidad</span><input data-ent-cant="${i}" type="number" inputmode="numeric" min="0" value="${x.cantidad}"></label>
      <button type="button" class="cot-quitar" data-quitar-ent="${i}">✕</button>
    </div>`).join('');
  const render = () => {
    bg.innerHTML = `
      <div class="modal">
        <h3>${nueva ? '🔁 Nueva iguala' : 'Editar iguala'}</h3>
        ${desde && desde.id ? '<p class="ayuda" style="margin:-8px 0 14px;font-size:0.85rem;">Llenamos los datos con tu prospecto. Revísalos y guarda.</p>' : ''}
        <div class="campo"><label>Cliente</label><input id="i-cliente" value="${esc(d.cliente)}" placeholder="Ej. Cafetería Aroma"></div>
        <div class="campo"><label>Servicio</label><input id="i-servicio" value="${esc(d.servicio)}" placeholder="Ej. Contenido para redes"></div>
        <div class="fila2">
          <div class="campo"><label>Monto mensual</label><input id="i-monto" type="number" inputmode="decimal" value="${d.monto}" placeholder="0"></div>
          <div class="campo"><label>Día de cobro</label><input id="i-dia" type="number" inputmode="numeric" min="1" max="31" value="${d.dia_cobro}"></div>
        </div>
        <div class="campo"><label>Empezó en</label><input id="i-inicio" type="month" value="${d.inicio}"></div>
        <div class="campo"><label>Qué le entregas cada mes</label>
          <div id="i-ents">${filas()}</div>
          <button type="button" class="col-agregar" data-agregar-ent>+ Agregar entregable</button></div>
        ${nueva ? '<label class="cot-check"><input type="checkbox" id="i-previos" checked> Si empezó antes de este mes, ya me pagaron los meses anteriores</label>' : ''}
        <div class="modal-pie">
          ${nueva ? '' : '<button class="btn peligro" data-borrar>Borrar</button>'}
          <div class="der"><button class="btn ghost" data-cerrar>Cancelar</button><button class="btn" data-guardar>Guardar</button></div>
        </div>
      </div>`;
  };
  render();
  const leer = () => {
    const $ = id => bg.querySelector('#' + id);
    d.cliente = $('i-cliente').value.trim(); d.servicio = $('i-servicio').value.trim();
    d.monto = $('i-monto').value; d.dia_cobro = Math.min(31, Math.max(1, parseInt($('i-dia').value, 10) || 1));
    d.inicio = $('i-inicio').value || mesHoy();
  };
  bg.addEventListener('input', e => {
    const t = e.target;
    if(t.dataset.entNom !== undefined) d.entregables[+t.dataset.entNom].nombre = t.value;
    if(t.dataset.entCant !== undefined) d.entregables[+t.dataset.entCant].cantidad = Math.max(0, parseInt(t.value, 10) || 0);
  });
  bg.addEventListener('click', async e => {
    if(e.target === bg){ cerrar(); return; }
    const t = e.target.closest('button'); if(!t) return;
    if(t.dataset.cerrar !== undefined) return cerrar();
    if(t.dataset.agregarEnt !== undefined){ leer(); d.entregables.push({ nombre:'', cantidad:1 }); render(); }
    if(t.dataset.quitarEnt !== undefined){ leer(); d.entregables.splice(+t.dataset.quitarEnt, 1); render(); }
    if(t.dataset.borrar !== undefined){
      if(!confirm(`¿Borrar la iguala de ${ig.cliente}? Se pierde su historial de cobros. Si solo terminó, mejor márcala como inactiva.`)) return;
      cerrar();
      const { data, error } = await sb.rpc('taller_borrar_iguala', { p_token: T.token, p_pin: T.pin, p_id: ig.id });
      if(pinRechazado(data)) return;
      if(error){ toast('No se pudo borrar.'); return; }
      T.igualas = T.igualas.filter(x => x.id !== ig.id); renderTablero();
    }
    if(t.dataset.guardar !== undefined){
      leer();
      if(!d.cliente){ toast('Escribe el nombre del cliente'); return; }
      const datos = { cliente: d.cliente, servicio: d.servicio, monto: +d.monto || 0, dia_cobro: d.dia_cobro, inicio: d.inicio,
        entregables: d.entregables.filter(x => x.nombre.trim()).map(x => ({ nombre: x.nombre.trim(), cantidad: +x.cantidad || 0 })) };
      if(nueva && bg.querySelector('#i-previos').checked && datos.inicio < mesHoy()){
        datos.registro = {};
        for(let m = datos.inicio; m < mesHoy(); m = mesSumar(m, 1)) datos.registro[m] = { pagado:true, fecha:'', e: datos.entregables.map(x => x.cantidad) };
      }
      cerrar();
      if(nueva){
        if(!(T.alumno.negocio || {}).igualas) await activarIgualas(true);
        const r = await guardarIguala(datos, { destacar:true, msg:'Iguala creada 🔁' });
        if(r && desde && desde.id){
          const { data } = await sb.rpc('taller_borrar_proyecto', { p_token: T.token, p_pin: T.pin, p_id: desde.id });
          if(!pinRechazado(data)){ T.proyectos = T.proyectos.filter(x => x.id !== desde.id); renderTablero('ig-' + r.id); }
        }
      } else guardarIguala({ id: ig.id, ...datos }, { msg:'Guardado' });
    }
  });
}

// Al cerrar un prospecto: ¿proyecto único o iguala mensual?
function preguntarTipoCierre(p){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal" style="max-width:440px;">
      <h3>🎉 ¡Cerraste ${esc(p.cliente || p.nombre)}!</h3>
      <p class="ayuda" style="margin:-6px 0 16px;font-size:0.88rem;">¿Qué tipo de trabajo es?</p>
      <div class="ig-tipo">
        <button data-tipo="unico"><strong>Proyecto único</strong><span>Se hace una vez: pasa a Producción</span></button>
        <button data-tipo="iguala"><strong>Iguala mensual</strong><span>Te paga cada mes: pasa a Clientes mensuales</span></button>
      </div>
      <div class="modal-pie"><div class="der"><button class="btn ghost" data-cerrar>Cancelar</button></div></div>
    </div>`;
  document.body.appendChild(bg);
  bg.addEventListener('click', e => {
    const t = e.target.closest('button');
    if(e.target === bg || (t && t.dataset.cerrar !== undefined)){ bg.remove(); return; }
    if(!t) return;
    bg.remove();
    if(t.dataset.tipo === 'unico') preguntarAnticipo(p);
    if(t.dataset.tipo === 'iguala') abrirEditorIguala(null, p);
  });
}

function abrirEditor(p){
  const nuevo = !p;
  const d = p ? { ...p } : { nombre:'', cliente:'', tipo:'', monto_total:'', anticipo:'', etapa:'prospecto', avance_edicion:0, fecha_entrega:'' };
  const opciones = SECCIONES.map(s => `<optgroup label="${s.num} · ${s.titulo}">${[...s.etapas, ...(s.key === 'cobranza' ? ['pagado'] : [])].map(e => `<option value="${e}" ${d.etapa === e ? 'selected' : ''}>${ETAPAS[e].nombre}</option>`).join('')}</optgroup>`).join('');
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <h3>${nuevo ? 'Nuevo proyecto' : 'Editar proyecto'}</h3>
      ${nuevo ? `<div class="campo"><label>¿Es iguala mensual?</label>
        <div class="chips"><button type="button" class="chip" id="e-es-iguala">🔁 Sí, me paga cada mes</button><button type="button" class="chip on">No, es un proyecto único</button></div></div>` : ''}
      <div class="campo"><label>Proyecto</label><input id="e-nombre" value="${esc(d.nombre)}" placeholder="Ej. Video de lanzamiento"></div>
      <div class="campo"><label>Cliente</label><input id="e-cliente" value="${esc(d.cliente)}" placeholder="Ej. Cafetería Aroma"></div>
      <div class="campo"><label>Tipo de contenido</label>
        <div class="chips" id="e-tipos">${TIPOS.map(t => `<button type="button" class="chip ${d.tipo === t ? 'on' : ''}" data-tipo="${t}">${t}</button>`).join('')}</div>
      </div>
      <div class="fila2">
        <div class="campo"><label>Monto total</label><input id="e-monto" type="number" inputmode="decimal" value="${d.monto_total === '' ? '' : +d.monto_total}" placeholder="0"></div>
        <div class="campo"><label>Anticipo recibido</label><input id="e-anticipo" type="number" inputmode="decimal" value="${d.anticipo === '' || +d.anticipo === 0 ? '' : +d.anticipo}" placeholder="0">
          <div class="ayuda"><a href="#" id="e-50" style="color:inherit;">Poner 50%</a></div></div>
      </div>
      <div class="fila2">
        <div class="campo"><label>Fecha de entrega</label><input id="e-fecha" type="date" value="${d.fecha_entrega || ''}"></div>
        <div class="campo"><label>Etapa</label><select id="e-etapa">${opciones}</select></div>
      </div>
      <div class="campo" id="e-edicion-campo">
        <label>Avance de edición · <span id="e-edicion-txt">${pasoEdicion(d.avance_edicion)} (${d.avance_edicion}%)</span></label>
        <input type="range" id="e-edicion" min="0" max="100" step="1" value="${d.avance_edicion}">
        <div class="chips">${PASOS_EDICION.slice(1).map(([v,n]) => `<button type="button" class="chip" data-ae="${v}">${n} · ${v}%</button>`).join('')}</div>
      </div>
      <div class="modal-pie">
        ${nuevo ? '' : '<button class="btn peligro" id="e-borrar">Borrar</button>'}
        <div class="der"><button class="btn ghost" data-cerrar>Cancelar</button><button class="btn" id="e-guardar">Guardar</button></div>
      </div>
    </div>`;
  document.body.appendChild(bg);
  const $ = id => bg.querySelector('#' + id);
  const cerrar = () => bg.remove();
  bg.addEventListener('click', e => { if(e.target === bg || e.target.closest('[data-cerrar]')) cerrar(); });

  let tipo = d.tipo;
  bg.querySelectorAll('[data-tipo]').forEach(c => c.addEventListener('click', () => {
    tipo = tipo === c.dataset.tipo ? '' : c.dataset.tipo;
    bg.querySelectorAll('[data-tipo]').forEach(x => x.classList.toggle('on', x.dataset.tipo === tipo));
  }));
  $('e-50').addEventListener('click', e => { e.preventDefault(); $('e-anticipo').value = Math.round((+$('e-monto').value || 0) / 2) || ''; });
  const syncEdicion = () => {
    $('e-edicion-campo').classList.toggle('oculto', $('e-etapa').value !== 'edicion');
    $('e-edicion-txt').textContent = `${pasoEdicion(+$('e-edicion').value)} (${$('e-edicion').value}%)`;
  };
  $('e-etapa').addEventListener('change', syncEdicion);
  $('e-edicion').addEventListener('input', syncEdicion);
  bg.querySelectorAll('[data-ae]').forEach(c => c.addEventListener('click', () => { $('e-edicion').value = c.dataset.ae; syncEdicion(); }));
  syncEdicion();
  if(nuevo) setTimeout(() => $('e-nombre').focus(), 50);
  if(nuevo) $('e-es-iguala').addEventListener('click', () => {
    const pre = { cliente: $('e-cliente').value.trim(), nombre: $('e-nombre').value.trim(), tipo, monto_total: +$('e-monto').value || '' };
    cerrar();
    abrirEditorIguala(null, pre);
  });

  $('e-guardar').addEventListener('click', async () => {
    const nombre = $('e-nombre').value.trim();
    if(!nombre){ $('e-nombre').focus(); toast('Ponle nombre al proyecto'); return; }
    const etapa = $('e-etapa').value;
    const datos = {
      nombre, cliente: $('e-cliente').value.trim(), tipo,
      monto_total: +$('e-monto').value || 0, anticipo: +$('e-anticipo').value || 0,
      fecha_entrega: $('e-fecha').value || '', etapa,
      avance_edicion: etapa === 'entregado' || etapa === 'pagado' ? 100 : +$('e-edicion').value
    };
    cerrar();
    if(nuevo) await guardar(datos, { msg:'Proyecto agregado' });
    else await guardar({ id:p.id, ...datos }, { destacar: etapa !== p.etapa, msg: etapa !== p.etapa ? mensajeEtapa(etapa) : 'Guardado' });
  });
  if(!nuevo) $('e-borrar').addEventListener('click', async () => {
    if(!confirm('¿Borrar "' + p.nombre + '"? Si no se cerró, mejor márcalo como Perdido.')) return;
    cerrar();
    const { data, error } = await sb.rpc('taller_borrar_proyecto', { p_token: T.token, p_pin: T.pin, p_id: p.id });
    if(pinRechazado(data)) return;
    if(error){ toast('No se pudo borrar.'); return; }
    T.proyectos = T.proyectos.filter(x => x.id !== p.id);
    renderTablero();
  });
}

async function borrarEjemplos(){
  if(!confirm('¿Borrar los proyectos de ejemplo? Tus proyectos no se tocan.')) return;
  const { data, error } = await sb.rpc('taller_borrar_ejemplos', { p_token: T.token, p_pin: T.pin });
  if(pinRechazado(data)) return;
  if(error){ toast('No se pudo borrar.'); return; }
  T.proyectos = T.proyectos.filter(p => !p.ejemplo);
  renderTablero();
  toast('Listo, ahora el tablero es todo tuyo');
}

function rutaAlumno(){
  const [slug, vista] = location.hash.replace(/^#\/?/, '').split('/');
  const c = slug && T.cursos.find(x => x.slug === slug && x.tiene);
  if(!c) return renderMundo();
  T.curso = c;
  let v = vista;
  if(!v){ try { v = localStorage.getItem('otp_vista_' + c.slug); } catch(e){} }
  if(!c.herramienta) v = 'clases';
  if(v !== 'clases' && v !== 'tablero') v = modulosDe(c).length ? 'clases' : 'tablero';
  try { localStorage.setItem('otp_vista_' + c.slug, v); } catch(e){}
  window.scrollTo(0, 0);
  if(v === 'tablero') renderTablero(); else renderClases();
}
function irA(ruta){ if(location.hash === ruta) rutaAlumno(); else location.hash = ruta; }
const modulosDe = c => T.modulos.filter(m => m.curso_id === c.id);

  if(c.precio == null || c.precio === '') return '';

  catch(e){ return c.precio + ' ' + c.moneda; }
}
function linkWhatsApp(tel, msg){
  const t = String(tel || '').replace(/\D/g, '');

// Convierte el link de YouTube/Vimeo en un reproductor
function videoEmbed(url){
  const u = String(url || '').trim();
  let m = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/);
  if(m) return 'https://www.youtube-nocookie.com/embed/' + m[1] + '?rel=0&modestbranding=1';
  m = u.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/([\da-f]+))?/);
  if(m) return 'https://player.vimeo.com/video/' + m[1] + (m[2] ? '?h=' + m[2] : '');
  return null;
}

    if(si && T.vistos.length && mods.every(x => T.vistos.includes(x.id))) toast('¡Terminaste todas las clases! 🎉');
    const { data, error } = await sb.rpc('taller_marcar_visto', { p_token: T.token, p_pin: T.pin, p_modulo: m.id, p_visto: si });
    if(pinRechazado(data)) return;

async function abrirAdmin(){
  app.innerHTML = '<div class="cargando">Cargando…</div>';
  if(!CLAVE){ mostrarEntrada(); return; }
  const { data, error } = await sb.rpc('taller_admin_datos', { p_clave: CLAVE });

  if(error){ app.innerHTML = '<div class="cargando">No se pudo cargar. Recarga en unos segundos.</div>'; return; }
  ADM = data;
  rutaAdmin();
}

// Llama a una función del panel; si la contraseña ya no vale, regresa a la entrada
async function adm(fn, args){
  const { data, error } = await sb.rpc(fn, { p_clave: CLAVE, ...args });
  if(error && /Contrase/.test(error.message)){ guardarClave(null); mostrarEntrada('Tu sesión expiró. Vuelve a entrar.'); return { error }; }
  return { data, error };
}

function slugDe(nombre){
  const base = String(nombre).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'taller';
  let s = base, k = 2;
  while(ADM.cursos.some(c => c.slug === s)) s = base + '-' + k++;
  return s;
}

      if(!confirm(`¿Borrar ${c.nombre}? Se borran sus clases y sus alumnos pierden el acceso (sus cuentas no se borran).`)) return;
      bg.remove();
      const { error } = await adm('taller_admin_borrar_curso', { p_id: c.id });
      if(error){ toast('No se pudo borrar.'); return; }
      ADM.cursos = ADM.cursos.filter(x => x.id !== c.id);
      ADM.modulos = ADM.modulos.filter(m => m.curso_id !== c.id);
      ADM.alumnos.forEach(a => { a.cursos = a.cursos.filter(x => x !== c.id); });
      location.hash = '';
      rutaAdmin();
    }
    if(t.dataset.guardar !== undefined){
      const nombre = $('c-nombre').value.trim();
      if(!nombre){ $('c-nombre').focus(); toast('Ponle nombre'); return; }
      const datos = { nombre, tipo: d.tipo, emoji: $('c-emoji').value.trim(), descripcion: $('c-desc').value.trim(),
        precio: $('c-precio').value, moneda: $('c-moneda').value, color: d.color, publicado: $('c-pub').checked };
      if(nuevo) datos.slug = slugDe(nombre); else datos.id = c.id;
      t.disabled = true;
      const { data, error } = await adm('taller_admin_guardar_curso', { p: datos });
      if(error){ t.disabled = false; toast('No se pudo guardar.'); return; }
      bg.remove();
      if(nuevo){ ADM.cursos.push(data); location.hash = 'taller/' + data.id; toast('¡Taller creado! Ahora sube sus clases.'); }
      else { Object.assign(c, data); rutaAdmin(); toast('Guardado'); }
    }
  });
}

function filaAlumno(a, c){
  const n = c ? clasesDe(c).length : 0, v = c ? clasesDe(c).filter(m => a.vistos.includes(m.id)).length : 0;
  const chips = c ? '' : `<div class="alumno-cursos">${ADM.cursos.filter(x => a.cursos.includes(x.id)).map(x => `<span style="--c:${esc(x.color || '#0a0908')}">${esc(x.emoji || '✦')} ${esc(x.nombre)}</span>`).join('') || '<span class="sin">Sin talleres</span>'}</div>`;
  return `
    <div class="alumno" data-alumno="${a.id}">
      <div class="avatar">${esc(iniciales(a.nombre))}</div>
      <div class="alumno-info">
        <div class="alumno-nombre">${esc(a.nombre)}</div>
        <div class="alumno-sub">${c && n ? `${v}/${n} clases · ` : ''}${c && c.herramienta ? `${a.proyectos_propios} ${a.proyectos_propios == 1 ? 'proyecto' : 'proyectos'} · ` : ''}${haceCuanto(a.ultimo_acceso)} · ${a.tiene_pin ? '🔐 con PIN' : a.acepto_privacidad ? 'aceptó aviso, sin PIN' : 'sin aceptar aviso'}</div>
        ${chips}
      </div>
      <button class="icono" data-copiar="${a.id}" title="Copiar link">🔗</button>
      <button class="icono" data-wa="${a.id}" title="Mandar por WhatsApp">💬</button>
      ${a.tiene_pin ? `<button class="icono" data-reset="${a.id}" title="Reiniciar PIN">🔑</button>` : ''}
      ${c ? `<button class="icono" data-quitar="${a.id}" title="Quitar de este taller">✕</button>`
          : `<button class="icono" data-talleres="${a.id}" title="Sus talleres">🎓</button><button class="icono" data-borrar="${a.id}" title="Borrar">🗑</button>`}
    </div>`;
}

// Alta + buscador + lista; si hay taller, el alta inscribe ahí
function bloqueAlumnos(lista, c){
  const filtrados = lista.filter(a => !FILTRO || (a.nombre + ' ' + (a.contacto || '')).toLowerCase().includes(FILTRO));
  const fuera = c ? ADM.alumnos.filter(a => !a.cursos.includes(c.id)) : [];
  return `
    <div class="alta">
      <div class="campo"><label>Nombre</label><input id="a-nombre" placeholder="Ej. Mariana López"></div>
      <div class="campo"><label>WhatsApp o correo (opcional)</label><input id="a-contacto" placeholder="Ej. 5512345678"></div>
      ${c ? '' : `<div class="campo"><label>Taller</label><select id="a-curso"><option value="">Ninguno por ahora</option>${ADM.cursos.map(x => `<option value="${x.id}">${esc(x.nombre)}</option>`).join('')}</select></div>`}
      <button class="btn" id="a-agregar">+ Dar de alta</button>
    </div>
    ${c && fuera.length ? `<div class="adm-existente"><span>¿Ya es tu alumno de otro taller?</span>
      <select id="a-existente"><option value="">Elige a la persona…</option>${fuera.map(a => `<option value="${a.id}">${esc(a.nombre)}</option>`).join('')}</select>
      <button class="btn ghost" id="a-inscribir">Darle acceso</button></div>` : ''}
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
      <input class="buscar" id="a-buscar" placeholder="Buscar alumno…" value="${esc(FILTRO)}">
      <span class="ayuda" style="margin-bottom:12px;">${lista.length} ${lista.length === 1 ? 'alumno' : 'alumnos'}</span>
    </div>
    <div class="alumnos">
      ${filtrados.length ? filtrados.map(a => filaAlumno(a, c)).join('') : `<div class="col-vacia" style="grid-column:1/-1;">${lista.length ? 'Nadie coincide con la búsqueda.' : 'Todavía no hay alumnos. Da de alta al primero arriba.'}</div>`}
    </div>`;
}

function conectarAlumnos(c){
  const nombre = document.getElementById('a-nombre');
  const agregar = async () => {
    if(!nombre.value.trim()){ nombre.focus(); return; }
    const btn = document.getElementById('a-agregar');
    btn.disabled = true; btn.textContent = 'Creando…';
    const curso = c ? c.id : (document.getElementById('a-curso').value || null);
    const { data, error } = await adm('taller_admin_crear_alumno', { p_nombre: nombre.value, p_contacto: document.getElementById('a-contacto').value, p_curso: curso });
    if(error){ btn.disabled = false; btn.textContent = '+ Dar de alta'; toast('No se pudo crear.'); return; }
    ADM.alumnos.unshift({ ...data, proyectos_propios: 0, cursos: curso ? [curso] : [], vistos: [], tiene_pin: false });
    rutaAdmin();
    copiar(linkAlumno(data.token));
    toast('Alumno creado. Su link ya está copiado.');
  };
  document.getElementById('a-agregar').addEventListener('click', agregar);
  [nombre, document.getElementById('a-contacto')].forEach(i => i.addEventListener('keydown', e => { if(e.key === 'Enter') agregar(); }));
  const buscador = document.getElementById('a-buscar');
  buscador.addEventListener('input', () => {
    FILTRO = buscador.value.trim().toLowerCase();
    rutaAdmin();
    const b = document.getElementById('a-buscar'); b.focus(); b.setSelectionRange(b.value.length, b.value.length);
  });
  const ins = document.getElementById('a-inscribir');
  if(ins) ins.addEventListener('click', async () => {
    const a = porId(document.getElementById('a-existente').value);
    if(!a) return;
    if(await inscribir(a, c, true)) toast(`${a.nombre} ya tiene ${c.nombre}. Su mismo link le sirve.`);
  });

  app.querySelectorAll('[data-reset]').forEach(b => b.addEventListener('click', async () => {
    const a = porId(b.dataset.reset);
    if(!confirm('¿Reiniciar el PIN de ' + a.nombre + '? La próxima vez que abra su link creará uno nuevo. Su información no se borra.')) return;
    const { error } = await adm('taller_admin_reiniciar_pin', { p_id: a.id });
    if(error){ toast('No se pudo reiniciar.'); return; }
    a.tiene_pin = false;
    rutaAdmin();
    toast('PIN reiniciado');
  }));
  app.querySelectorAll('[data-copiar]').forEach(b => b.addEventListener('click', () => copiar(linkAlumno(porId(b.dataset.copiar).token))));
  app.querySelectorAll('[data-wa]').forEach(b => b.addEventListener('click', () => {
    const a = porId(b.dataset.wa);
    const primer = String(a.nombre).split(' ')[0];
    const msg = c
      ? `¡Hola ${primer}! 👋 Ya tienes acceso a *${c.nombre}* en Level Lab:\n${linkAlumno(a.token)}\n\nAhí encuentras tus clases${c.herramienta ? ' y tu tablero' : ''}. Es tu link personal: guárdalo en tu celular.`
      : `¡Hola ${primer}! 👋 Este es tu acceso a Level Lab:\n${linkAlumno(a.token)}\n\nAhí encuentras todos tus talleres. Es tu link personal: guárdalo en tu celular.`;
    window.open(linkWhatsApp(a.contacto, msg), '_blank');
  }));
  app.querySelectorAll('[data-quitar]').forEach(b => b.addEventListener('click', async () => {
    const a = porId(b.dataset.quitar);
    if(!confirm(`¿Quitarle ${c.nombre} a ${a.nombre}? Ya no lo verá en su link (su información no se borra).`)) return;
    inscribir(a, c, false);
  }));
  app.querySelectorAll('[data-talleres]').forEach(b => b.addEventListener('click', () => elegirTalleres(porId(b.dataset.talleres))));
  app.querySelectorAll('[data-borrar]').forEach(b => b.addEventListener('click', async () => {
    const a = porId(b.dataset.borrar);
    if(!confirm('¿Borrar a ' + a.nombre + ' y toda su información (tablero, talleres y avance)? Su link dejará de funcionar.')) return;
    const { error } = await adm('taller_admin_borrar_alumno', { p_id: a.id });
    if(error){ toast('No se pudo borrar.'); return; }
    ADM.alumnos = ADM.alumnos.filter(x => x.id !== a.id);
    rutaAdmin();
  }));
}
const porId = id => ADM.alumnos.find(a => a.id === id);

async function inscribir(a, c, si){
  const { error } = await adm('taller_admin_inscribir', { p_alumno: a.id, p_curso: c.id, p_si: si });
  if(error){ toast('No se pudo guardar.'); return false; }
  a.cursos = si ? [...new Set([...a.cursos, c.id])] : a.cursos.filter(x => x !== c.id);
  rutaAdmin();
  return true;
}

function elegirTalleres(a){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal" style="max-width:420px;">
      <h3>Talleres de ${esc(a.nombre)}</h3>
      <p class="ayuda" style="margin:-6px 0 14px;font-size:0.85rem;">Lo que actives le aparece en su mismo link.</p>
      ${ADM.cursos.map(c => `<label class="cot-check adm-check"><input type="checkbox" data-curso="${c.id}" ${a.cursos.includes(c.id) ? 'checked' : ''}> ${esc(c.emoji || '✦')} ${esc(c.nombre)}</label>`).join('')}
      <div class="modal-pie"><div class="der"><button class="btn" data-cerrar>Listo</button></div></div>
    </div>`;
  document.body.appendChild(bg);
  bg.addEventListener('click', e => { if(e.target === bg || e.target.closest('[data-cerrar]')) bg.remove(); });
  bg.querySelectorAll('[data-curso]').forEach(i => i.addEventListener('change', async () => {
    const c = ADM.cursos.find(x => x.id === i.dataset.curso);
    if(!await inscribir(a, c, i.checked)) i.checked = !i.checked;
  }));
}

function renderAdminAlumnos(){
  app.innerHTML = `${adminHero('alumnos', 'Todos tus alumnos', 'Cada persona tiene un solo link y un PIN para todos sus talleres. Con 🎓 eliges qué talleres tiene.')}${bloqueAlumnos(ADM.alumnos, null)}`;
  conectarAdminHero();
  conectarAlumnos(null);
}

function renderAdminCurso(c){
  const clases = clasesDe(c);
  app.innerHTML = `
    ${adminHero('talleres', `${esc(c.emoji ? c.emoji + ' ' : '')}${esc(c.nombre)}`, '')}
    <div class="adm-curso-acc">
      <a href="#" class="btn ghost">← Todos los talleres</a>
      <button class="btn ghost" id="a-editar-curso">✏️ Editar taller</button>
      <span class="ayuda">${esc(c.tipo || 'Taller')}${precioCurso(c) ? ' · ' + precioCurso(c) : ''}${c.publicado ? ' · visible para todos' : ' · oculto'}</span>
    </div>

    <section class="adm-bloque">
      <div class="seccion-head"><h2>▶ Clases</h2><span class="ayuda">${clases.length} ${clases.length === 1 ? 'clase' : 'clases'}</span></div>
      <p class="seccion-intro">Sube cada video a YouTube como <strong>“No listado”</strong> (solo lo ve quien tiene el link) y pega aquí el link. También funciona con Vimeo.</p>
      <div class="adm-clases">
        ${clases.map((m, k) => `
          <div class="adm-clase">
            <span class="clase-num">${k + 1}</span>
            <div class="adm-clase-info"><strong>${esc(m.titulo || 'Sin título')}</strong><span>${m.video ? (videoEmbed(m.video) ? '🎬 Video listo' : '🔗 Link (se abre aparte)') : '⚠️ Falta el video'}</span></div>
            <button class="icono" data-subir="${k}" title="Subir" ${k ? '' : 'disabled'}>↑</button>
            <button class="icono" data-bajar="${k}" title="Bajar" ${k < clases.length - 1 ? '' : 'disabled'}>↓</button>
            <button class="icono" data-editar-clase="${m.id}" title="Editar">✏️</button>
          </div>`).join('')}
        <button class="col-agregar" id="a-nueva-clase">+ Agregar clase</button>
      </div>
    </section>

    <section class="adm-bloque">
      <div class="seccion-head"><h2>👥 Alumnos</h2></div>
      ${bloqueAlumnos(alumnosDe(c), c)}
    </section>`;
  conectarAdminHero();
  conectarAlumnos(c);
  document.getElementById('a-editar-curso').addEventListener('click', () => editarCurso(c));
  document.getElementById('a-nueva-clase').addEventListener('click', () => editarClase(c, null));
  app.querySelectorAll('[data-editar-clase]').forEach(b => b.addEventListener('click', () => editarClase(c, ADM.modulos.find(m => m.id === b.dataset.editarClase))));
  const mover = async (k, d) => {
    const a = clases[k], b = clases[k + d];
    const oa = a.orden, ob = b.orden === oa ? oa + d : b.orden;
    a.orden = ob; b.orden = oa;
    ADM.modulos.sort((x, y) => x.orden - y.orden || String(x.creado).localeCompare(String(y.creado)));
    rutaAdmin();
    const r = await Promise.all([adm('taller_admin_guardar_modulo', { p: { id: a.id, orden: a.orden } }), adm('taller_admin_guardar_modulo', { p: { id: b.id, orden: b.orden } })]);
    if(r.some(x => x.error)) toast('No se pudo guardar el orden.');
  };
  app.querySelectorAll('[data-subir]').forEach(b => b.addEventListener('click', () => mover(+b.dataset.subir, -1)));
  app.querySelectorAll('[data-bajar]').forEach(b => b.addEventListener('click', () => mover(+b.dataset.bajar, 1)));
}

function editarClase(c, m){
  const nueva = !m;
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <h3>${nueva ? 'Nueva clase' : 'Editar clase'}</h3>
      <div class="campo"><label>Título</label><input id="m-titulo" value="${esc(m ? m.titulo : '')}" placeholder="Ej. Cómo cotizar un proyecto"></div>
      <div class="campo"><label>Link del video</label><input id="m-video" value="${esc(m ? m.video : '')}" placeholder="https://youtu.be/…">
        <div class="ayuda" id="m-video-ok" style="margin-top:4px;"></div></div>
      <div class="campo"><label>Descripción (opcional)</label><textarea id="m-desc" rows="4" class="cot-textarea" placeholder="De qué trata, qué hacer después de verla…">${esc(m ? m.descripcion : '')}</textarea></div>
      <div class="modal-pie">
        ${nueva ? '' : '<button class="btn peligro" data-borrar>Borrar</button>'}
        <div class="der"><button class="btn ghost" data-cerrar>Cancelar</button><button class="btn" data-guardar>Guardar</button></div>
      </div>
    </div>`;
  document.body.appendChild(bg);
  const $ = id => bg.querySelector('#' + id);
  const revisar = () => { const v = $('m-video').value.trim(); $('m-video-ok').textContent = !v ? 'Puedes dejarlo vacío y pegarlo después.' : videoEmbed(v) ? '✓ Se va a ver dentro de la plataforma' : 'No es un link de YouTube o Vimeo: se abrirá aparte.'; };
  $('m-video').addEventListener('input', revisar); revisar();
  if(nueva) setTimeout(() => $('m-titulo').focus(), 50);
  bg.addEventListener('click', async e => {
    if(e.target === bg || e.target.closest('[data-cerrar]')){ bg.remove(); return; }
    const t = e.target.closest('button'); if(!t) return;
    if(t.dataset.borrar !== undefined){
      if(!confirm(`¿Borrar la clase "${m.titulo}"?`)) return;
      bg.remove();
      const { error } = await adm('taller_admin_borrar_modulo', { p_id: m.id });
      if(error){ toast('No se pudo borrar.'); return; }
      ADM.modulos = ADM.modulos.filter(x => x.id !== m.id);
      rutaAdmin();
    }
    if(t.dataset.guardar !== undefined){
      const titulo = $('m-titulo').value.trim();
      if(!titulo){ $('m-titulo').focus(); toast('Ponle título a la clase'); return; }
      const datos = { titulo, video: $('m-video').value.trim(), descripcion: $('m-desc').value.trim() };
      if(nueva) datos.curso_id = c.id; else datos.id = m.id;
      t.disabled = true;
      const { data, error } = await adm('taller_admin_guardar_modulo', { p: datos });
      if(error){ t.disabled = false; toast('No se pudo guardar.'); return; }
      bg.remove();
      if(nueva) ADM.modulos.push(data); else Object.assign(m, data);
      rutaAdmin();
      toast(nueva ? 'Clase agregada 🎬' : 'Guardado');
    }
  });
}

// ============ Arranque ============
// ?t=TOKEN → mundo Level Lab del alumno. Sin token → panel (pide contraseña).
const params = new URLSearchParams(location.search);
if(params.get('t')) abrirTablero(params.get('t'));
else abrirAdmin();
</script>
</body>
</html>
